<style>
:root{
  --bg:#f2f3f7; --surface:#ffffff; --surface2:#f7f8fb; --fg:#151a26; --muted:#5f6779; --faint:#8a91a2; --line:#e3e6ee;
  --brand:#1d3b8f; --brand-2:#2f56c4; --brand-soft:#e7ecfb; --on-brand:#ffffff;
  --ok:#17784a; --ok-soft:#e2f4ea; --warn:#a85410; --warn-soft:#fdf0e2; --bad:#b42318; --bad-soft:#fde8e6;
  --shadow:0 1px 2px rgba(20,26,40,.06),0 4px 14px rgba(20,26,40,.05);
  --r:14px; --nav-h:64px;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1218; --surface:#181c25; --surface2:#1e232e; --fg:#e9ecf2; --muted:#a0a7b8; --faint:#7a8296; --line:#2a303d;
  --brand:#8fa8ff; --brand-2:#a9bbff; --brand-soft:#1f2848; --on-brand:#0d1330;
  --ok:#6fd39f; --ok-soft:#14301f; --warn:#f2a65e; --warn-soft:#352414; --bad:#f4877d; --bad-soft:#3a1b19;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1218; --surface:#181c25; --surface2:#1e232e; --fg:#e9ecf2; --muted:#a0a7b8; --faint:#7a8296; --line:#2a303d;
  --brand:#8fa8ff; --brand-2:#a9bbff; --brand-soft:#1f2848; --on-brand:#0d1330;
  --ok:#6fd39f; --ok-soft:#14301f; --warn:#f2a65e; --warn-soft:#352414; --bad:#f4877d; --bad-soft:#3a1b19;
  --shadow:none; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* header */
.hdr{position:sticky;top:0;z-index:10;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));display:flex;align-items:center;gap:12px}
.hdr h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.02em;flex:1;min-width:0}
.hdr small{display:block;font-size:13px;color:var(--muted);font-weight:400;letter-spacing:0}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex-shrink:0}
.iconbtn svg{width:20px;height:20px}
.cloudpill{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px;flex-shrink:0;color:var(--muted)}
.cloudpill svg{width:18px;height:18px}
.cloudpill[data-st="ok"]{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.cloudpill[data-st="wait"]{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.cloudpill[data-st="err"]{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.cloudpill[data-st="off"]{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
@media (prefers-reduced-motion:no-preference){.cloudpill[data-st="wait"] svg{animation:pulse 1.2s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}}
.iconbtn.cloud{position:relative}
.iconbtn.cloud i{position:absolute;right:6px;bottom:6px;width:10px;height:10px;border-radius:99px;border:2px solid var(--surface);background:var(--faint)}
.iconbtn.cloud[data-st="ok"]{color:var(--ok)} .iconbtn.cloud[data-st="ok"] i{background:var(--ok)}
.iconbtn.cloud[data-st="wait"]{color:var(--warn)} .iconbtn.cloud[data-st="wait"] i{background:var(--warn)}
.iconbtn.cloud[data-st="err"]{color:var(--bad)} .iconbtn.cloud[data-st="err"] i{background:var(--bad)}
.iconbtn.cloud[data-st="off"]{color:var(--muted)}
main{max-width:760px;margin:0 auto;padding:4px max(16px,env(safe-area-inset-right)) calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 90px) max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:18px}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:15;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav div{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);height:var(--nav-h)}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--faint)}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--brand)}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 14px);z-index:14;height:52px;padding:0 20px 0 16px;border-radius:16px;border:0;background:var(--brand);color:var(--on-brand);font-weight:600;display:flex;align-items:center;gap:8px;box-shadow:0 6px 20px rgba(29,59,143,.3)}
.fab svg{width:20px;height:20px}

/* blocks */
.sec{display:flex;flex-direction:column;gap:10px}
.sechd{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sechd h2{margin:0;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.sechd button{border:0;background:none;color:var(--brand);font-weight:600;font-size:14px;padding:4px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:14px 16px}
.hero{background:linear-gradient(135deg,#1d3b8f,#2f56c4);color:#fff;border:0;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
:root[data-theme="dark"] .hero{background:linear-gradient(135deg,#1c2a5c,#26407f)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero{background:linear-gradient(135deg,#1c2a5c,#26407f)}}
.hero .lbl{font-size:13px;opacity:.85}
.hero .big{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.hero .row{display:flex;justify-content:space-between;gap:10px;font-size:13px;opacity:.92}
.hero .bar{height:8px;background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden}
.hero .bar i{display:block;height:100%;background:#7ff0b2;border-radius:99px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{padding:12px 14px;min-width:0}
.kpi b{display:block;font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi span{font-size:12.5px;color:var(--muted)}
.kpi.bad b{color:var(--bad)} .kpi.ok b{color:var(--ok)}
.limit{display:flex;align-items:center;gap:12px;padding:12px 14px}
.limit .pct{font-size:20px;font-weight:700;color:var(--brand);font-variant-numeric:tabular-nums}
.limit .txt{flex:1;min-width:0;font-size:13px;color:var(--muted)}
.limit .txt b{display:block;color:var(--fg);font-size:14px}
.limit.stale{border-color:var(--warn)}
.banner{padding:12px 14px;border-radius:var(--r);font-size:14px;display:flex;gap:10px;align-items:center}
.banner.warn{background:var(--warn-soft)} .banner.info{background:var(--brand-soft)}
.banner span{flex:1}
.item>svg{width:18px;height:18px;flex-shrink:0;color:var(--faint)}
.banner>svg{width:22px;height:22px;flex-shrink:0}
.limit>svg{width:18px;height:18px;flex-shrink:0;color:var(--faint)}
a.btn{text-decoration:none;color:inherit}
button.card{font:inherit;color:inherit}
.banner button{border:0;background:var(--surface);border-radius:10px;padding:7px 12px;font-weight:600;font-size:13px}

.list{display:flex;flex-direction:column}
.list>.item+.item{border-top:1px solid var(--line)}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left;background:none;border:0}
.item .av{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:15px;flex-shrink:0;background:var(--brand-soft);color:var(--brand)}
.item .av.bad{background:var(--bad-soft);color:var(--bad)} .item .av.warn{background:var(--warn-soft);color:var(--warn)} .item .av.ok{background:var(--ok-soft);color:var(--ok)}
.item .av svg{width:20px;height:20px}
.item .main{flex:1;min-width:0}
.item .main b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .main small{display:block;margin-top:1px;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .side{text-align:right;flex-shrink:0}
.item .side b{display:block;font-weight:600;font-variant-numeric:tabular-nums}
.item .side small{font-size:12px;color:var(--muted)}
.item .act{display:flex;gap:6px;flex-shrink:0}
.pill{display:inline-block;font-size:11.5px;font-weight:700;border-radius:99px;padding:2px 8px;white-space:nowrap}
.p-bad{background:var(--bad-soft);color:var(--bad)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-ok{background:var(--ok-soft);color:var(--ok)} .p-info{background:var(--brand-soft);color:var(--brand)} .p-mute{background:var(--surface2);color:var(--muted)}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);margin-bottom:4px;font-size:16px}
.empty button{margin-top:12px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px}
.btn.sm{min-height:34px;padding:6px 11px;font-size:13px;border-radius:10px}
.btn.pri{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.wa{background:#1f9d55;color:#fff;border-color:#1f9d55}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.ghost{border-color:transparent;background:transparent;color:var(--brand)}
.btn svg{width:18px;height:18px}
.btn:disabled{opacity:.5}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns.end{justify-content:flex-end}
.btns.grow>*{flex:1}

.seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:7px 8px;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 13px;font-size:13.5px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.search{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.monthnav{display:flex;align-items:center;gap:8px}
.monthnav b{flex:1;text-align:center;font-size:16px}

/* sheet */
.ov{position:fixed;inset:0;z-index:40;background:rgba(8,10,18,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:600px;max-height:92vh;max-height:92dvh;overflow-y:auto;border-radius:20px 20px 0 0;padding:8px max(18px,env(safe-area-inset-right)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 2px;flex-shrink:0}
.sheet h3{margin:0;font-size:20px;letter-spacing:-.01em}
.sheet .sub{margin:-8px 0 0;color:var(--muted);font-size:14px}
@media (min-width:680px){.ov{align-items:center}.sheet{border-radius:20px}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .2s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.5}}}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label{font-size:13px;color:var(--muted);font-weight:600}
.fld input,.fld select,.fld textarea{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);font-size:16px}
.fld textarea{min-height:70px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g2>*{min-width:0}
.hint{font-size:13px;color:var(--muted);margin:0}
.err{font-size:14px;color:var(--bad);margin:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;overflow-wrap:anywhere}
.calc{background:var(--brand-soft);border-radius:var(--r);padding:14px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.calc b{font-size:24px;font-variant-numeric:tabular-nums}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 11px;font-weight:600;font-size:13.5px}
.quick button.hl{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.grid12{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.grid12 button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 2px;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.grid12 button small{font-size:10.5px;font-weight:500;color:var(--muted)}
.grid12 .paid{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.grid12 .part{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.grid12 .owed{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.grid12 .na{opacity:.4}
.grid12 .paid small,.grid12 .part small,.grid12 .owed small{color:inherit}

/* chart */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--sans)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tfoot td{font-weight:700;border-bottom:0}

/* lock */
.lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px}
.lock h2{margin:0;font-size:20px}
.dots{display:flex;gap:14px}
.dots i{width:14px;height:14px;border-radius:99px;border:2px solid var(--brand)}
.dots i.f{background:var(--brand)}
.dots.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pad3{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
.pad3 button{touch-action:manipulation;user-select:none;-webkit-user-select:none;height:72px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:26px;font-weight:500}
.pad3 button.t{border:0;background:none;font-size:15px;color:var(--brand);font-weight:600}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 80px);z-index:60;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:90vw;text-align:center}

/* receipt */
.rcpt{border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;background:var(--surface)}
.rcpt .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.rcpt .top b{font-size:18px}
.rcpt .amt{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.rcpt .sig{display:flex;justify-content:space-between;gap:20px;margin-top:20px;font-size:13px;color:var(--muted)}
.rcpt .sig div{flex:1;border-top:1px solid var(--muted);padding-top:6px;text-align:center}
#printArea{display:none}
@media print{
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important;padding:20px;color:#000}
  #printArea .rcpt{border:1px solid #999;background:#fff;color:#000}
  #printArea .sig div{border-color:#000;color:#000}
}
</style>
</head>

<script>
"use strict";
/* ================== sabitler ================== */
const VERSION="2.0.6";
const KEY="kira-defteri-v1";
const AYLAR=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const AYK=["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];
/* Uygulamayla gelen son bilinen oran. tufe.json daha yenisini getirir. */
const DEF_TUFE={tufe:31.49,tufeAy:"2026-10",kaynak:"TÜİK (Eylül 2026 verisi)"};
const GIDER_TUR=["Aidat","Emlak vergisi","Tamir / bakım","DASK / sigorta","Fatura","Komisyon","Diğer"];
const YONTEM=["Havale / EFT","Nakit","Diğer"];

function parseISO(s){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||"");return m?new Date(+m[1],+m[2]-1,+m[3]):null}
const toISO=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
function addMonths(ym,n){let[y,m]=ym.split("-").map(Number);m=m-1+n;y+=Math.floor(m/12);m=((m%12)+12)%12;return ymOf(y,m)}

function parseAnyDate(v){
  if(v==null||v==="")return "";
  if(v instanceof Date&&!isNaN(v))return toISO(v);
  if(typeof v==="number"){const d=new Date(Math.round((v-25569)*864e5));return toISO(new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()))}
  const s=String(v).trim();let m;
  if(m=/^(\d{4})[-./](\d{1,2})[-./](\d{1,2})/.exec(s))return toISO(new Date(+m[1],+m[2]-1,+m[3]));
  if(m=/^(\d{1,2})[-./](\d{1,2})[-./](\d{2,4})/.exec(s)){let y=+m[3];if(y<100)y+=2000;return toISO(new Date(y,+m[2]-1,+m[1]))}
  return "";
}
function parseMoney(v){
  if(typeof v==="number")return v;
  let s=String(v??"").replace(/[^\d.,-]/g,"");if(!s)return 0;
  if(s.includes(",")&&s.includes("."))s=s.replace(/\./g,"").replace(",",".");
  else if(s.includes(",")){s=/,\d{1,2}$/.test(s)?s.replace(",","."):s.replace(/,/g,"")}
  else if(/\.\d{3}(\.|$)/.test(s))s=s.replace(/\./g,"");
  return parseFloat(s)||0;
}

function fmtTyping(v){
  v=String(v).replace(/[^\d,]/g,"");
  const i=v.indexOf(",");let a=i<0?v:v.slice(0,i),b=i<0?null:v.slice(i+1).replace(/,/g,"").slice(0,2);
  a=a.replace(/^0+(?=\d)/,"");
  a=a.replace(/\B(?=(\d{3})+(?!\d))/g,".");
  return b===null?a:a+","+b;
}

/* ================== BULUT (Firebase) ==================
   Yapı: users/{uid}/{mulkler|kiracilar|odemeler|giderler}/{id} ve users/{uid}/meta/ayar
   Telefondaki kopya her zaman tutulur; giriş yapılmışsa her değişiklik buluta da yazılır. */
const FIREBASE_CONFIG={
  apiKey:"AIzaSyCIhkXR5fNmEoYQHigFPp3tvIXi0Ut3YLg",
  authDomain:"kira-defteri-5c6f6.firebaseapp.com",

  appId:"1:537794896090:web:5d20507d1af3974aa745e3"
};
const COLS=["mulkler","kiracilar","odemeler","giderler"];
const SYNC_AYAR=["ad","tel","iban","tufe","tema"];
const CLOUD={on:false,api:null,user:null,ready:false,last:{},pending:false,err:"",unsubs:[],needVerify:false,denied:false};
function cloudMap(){
  const m={};
  for(const c of COLS)for(const r of S[c])if(r&&r.id)m[c+"/"+r.id]=JSON.stringify(r);
  const a={};for(const k of SYNC_AYAR)a[k]=S.ayar[k]??null;m["meta/ayar"]=JSON.stringify(a);
  return m;
}
function cloudPush(){
  if(!CLOUD.user||!CLOUD.ready)return;
  const now=cloudMap(),prev=CLOUD.last,ops=[];
  for(const k in now)if(prev[k]!==now[k])ops.push({set:k,data:JSON.parse(now[k])});
  for(const k in prev)if(!(k in now))ops.push({del:k});
  if(!ops.length)return;
  CLOUD.last=now;CLOUD.pending=true;cloudBadge();
  CLOUD.api.write(CLOUD.user.uid,ops).then(()=>{CLOUD.err="";CLOUD.pending=false;CLOUD.syncAt=Date.now();cloudBadge();if(tab==="yedek")renderSoft()}).catch(e=>{CLOUD.err=cloudErr(e);cloudBadge();toast("Buluta yazılamadı: "+CLOUD.err)});
}
function applyRemote(col,docs){
  if(col==="meta"){
    const a=docs.find(d=>d.id==="ayar");
    if(a){for(const k of SYNC_AYAR)if(k in a)S.ayar[k]=a[k];applyTheme()}
    const rest={};for(const k in CLOUD.last)if(k!=="meta/ayar")rest[k]=CLOUD.last[k];
    if(a){const o={};for(const k of SYNC_AYAR)o[k]=a[k]??null;rest["meta/ayar"]=JSON.stringify(o)}
    CLOUD.last=rest;
  }else{
    S[col]=docs.map(({id,...d})=>({...d,id}));
    const rest={};for(const k in CLOUD.last)if(!k.startsWith(col+"/"))rest[k]=CLOUD.last[k];
    for(const r of S[col])rest[col+"/"+r.id]=JSON.stringify(r);
    CLOUD.last=rest;
  }
  saveLocal();
}
function mergeById(local,remote){
  const m=new Map();for(const r of local)if(r&&r.id)m.set(r.id,r);for(const r of remote)m.set(r.id,r);return[...m.values()];
}
async function cloudStart(){
  if(CLOUD.on)return;
  const fake=window.__FB_FAKE;
  if(!FIREBASE_CONFIG&&!fake)return;
  CLOUD.on=true;
  try{CLOUD.api=fake||await fbAdapter(FIREBASE_CONFIG)}catch(e){CLOUD.on=false;CLOUD.err="Bulut yüklenemedi (internet?)";cloudBadge();return}
  CLOUD.api.onAuth(cloudOnUser);
}
async function cloudOnUser(u){
    CLOUD.unsubs.forEach(f=>{try{f()}catch(e){}});CLOUD.unsubs=[];CLOUD.ready=false;
    CLOUD.user=u||null;CLOUD.err="";CLOUD.needVerify=false;CLOUD.denied=false;cloudBadge();
    if(!u){render();return}
    /* e-postası doğrulanmamış hesap buluta erişemez (başkasının adresiyle hesap açılmasını önler) */
    if(u.emailVerified===false){CLOUD.needVerify=true;cloudBadge();render();return}
    try{
      const remote=await CLOUD.api.readAll(u.uid);
      const sameOwner=!S.cloudUid||S.cloudUid===u.uid;
      const hasRemote=COLS.some(c=>remote[c].length);
      const rAyar=remote.meta.find(d=>d.id==="ayar");
      /* CLOUD.last = buluttaki durum; böylece sadece eksikler gönderilir */
      CLOUD.last={};
      for(const c of COLS)for(const r of remote[c])CLOUD.last[c+"/"+r.id]=JSON.stringify(r);
      if(rAyar){const o={};for(const k of SYNC_AYAR)o[k]=rAyar[k]??null;CLOUD.last["meta/ayar"]=JSON.stringify(o)}
      if(sameOwner){
        /* ilk giriş ya da aynı hesap: telefondakiyle buluttakini birleştir, hiçbir kayıt kaybolmaz */
        for(const c of COLS)S[c]=mergeById(S[c],remote[c].map(({id,...d})=>({...d,id})));
        if(rAyar)for(const k of SYNC_AYAR){if(rAyar[k]!=null&&rAyar[k]!=="")S.ayar[k]=rAyar[k]}
      }else{
        /* telefonda başka bir hesabın verisi var: karıştırma, bu hesabın bulut verisini getir */
        const keep={pinHash:S.ayar.pinHash};const t=S.tufeOto;
        S=blank();S.ayar.pinHash=keep.pinHash;S.tufeOto=t;
        for(const c of COLS)S[c]=remote[c].map(({id,...d})=>({...d,id}));
        if(rAyar)for(const k of SYNC_AYAR)if(k in rAyar)S.ayar[k]=rAyar[k];
      }
      S.cloudUid=u.uid;CLOUD.ready=true;saveLocal();applyTheme();
      cloudPush();
      if(!hasRemote&&COLS.some(c=>S[c].length))toast("Veriler buluta yedeklendi");
      CLOUD.unsubs=CLOUD.api.listen(u.uid,(col,docs,meta)=>{
        CLOUD.pending=!!(meta&&meta.hasPendingWrites);if(!CLOUD.pending)CLOUD.syncAt=Date.now();
        applyRemote(col,docs);cloudBadge();renderSoft();
      });
      render();
    }catch(e){
      if((e&&e.code)==="permission-denied"){CLOUD.denied=true;CLOUD.err="Bu hesap henüz onaylı değil";cloudBadge();render();return}
      CLOUD.err=cloudErr(e);cloudBadge();toast("Bulut: "+CLOUD.err)}
}

function cloudErr(e){
  const c=(e&&e.code)||"";
  const M={"auth/invalid-credential":"E-posta veya şifre hatalı.","auth/wrong-password":"Şifre hatalı.","auth/user-not-found":"Bu e-postayla hesap yok.","auth/invalid-email":"E-posta adresi geçersiz.","auth/email-already-in-use":"Bu e-postayla zaten hesap var. Giriş yap'ı dene.","auth/weak-password":"Şifre en az 6 karakter olmalı.","auth/popup-closed-by-user":"Giriş penceresi kapatıldı.","auth/cancelled-popup-request":"Giriş penceresi kapatıldı.","auth/popup-blocked":"Giriş penceresi engellendi. E-posta ile girişi dene.","auth/unauthorized-domain":"Bu adres Firebase'de yetkili değil (Authorized domains).","auth/operation-not-allowed":"Bu giriş yöntemi Firebase'de açık değil.","auth/network-request-failed":"İnternet bağlantısı yok.","auth/too-many-requests":"Çok fazla deneme. Biraz bekleyip tekrar dene.","permission-denied":"Bulut erişim izni yok (güvenlik kuralları).","unavailable":"Buluta ulaşılamıyor; internet gelince eşitlenecek."};
  return M[c]||((e&&e.message)||"Bilinmeyen hata").replace(/^Firebase: /,"");
}
function cloudBadge(){
  const b=$("cloudBtn");if(!b)return;
  if(!CLOUD.on&&!FIREBASE_CONFIG&&!window.__FB_FAKE){b.hidden=true;return}
  b.hidden=false;
  let st,t;
  if(!CLOUD.user){st="off";t="Bulut kapalı: giriş yap"}
  else if(CLOUD.needVerify){st="wait";t="E-posta doğrulaması bekleniyor"}
  else if(CLOUD.denied){st="err";t="Hesap onay bekliyor"}
  else if(CLOUD.err){st="err";t="Eşitleme sorunu"}
  else if(CLOUD.pending||!navigator.onLine){st="wait";t=navigator.onLine?"Eşitleniyor":"İnternet yok, sonra eşitlenecek"}
  else{st="ok";t="Bulutla eşitlendi"}
  b.dataset.st=st;b.setAttribute("aria-label",t);b.title=t;
  const tx=$("cloudTxt");if(tx)tx.textContent=st==="ok"?"Bulutta":st==="wait"?(navigator.onLine?"Eşitleniyor":"Çevrimdışı"):st==="err"?"Sorun var":"Bulut kapalı";
  if(st==="ok"&&!CLOUD.pending)CLOUD.syncAt=CLOUD.syncAt||Date.now();
}

async function fbAdapter(cfg){
  const B="https://www.gstatic.com/firebasejs/10.12.2/";
  const [{initializeApp},A,F]=await Promise.all([import(B+"firebase-app.js"),import(B+"firebase-auth.js"),import(B+"firebase-firestore.js")]);
  const app=initializeApp(cfg);
  let auth;try{auth=A.initializeAuth(app,{persistence:[A.indexedDBLocalPersistence,A.browserLocalPersistence],popupRedirectResolver:A.browserPopupRedirectResolver})}catch(e){auth=A.getAuth(app)}
  let db;try{db=F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})})}catch(e){db=F.getFirestore(app)}
  const colRef=(uid,c)=>F.collection(db,"users",uid,c);
  return{
    onAuth:cb=>A.onAuthStateChanged(auth,cb),
    google:()=>A.signInWithPopup(auth,new A.GoogleAuthProvider()),
    emailIn:(e,p)=>A.signInWithEmailAndPassword(auth,e,p),
    emailUp:async(e,p)=>{const c=await A.createUserWithEmailAndPassword(auth,e,p);try{await A.sendEmailVerification(c.user)}catch(x){}return c},
    sendVerify:()=>A.sendEmailVerification(auth.currentUser),
    async reloadUser(){if(!auth.currentUser)return null;await A.reload(auth.currentUser);await auth.currentUser.getIdToken(true);return auth.currentUser},
    reset:e=>A.sendPasswordResetEmail(auth,e),
    out:()=>A.signOut(auth),
    async readAll(uid){const o={};await Promise.all([...COLS,"meta"].map(async c=>{const sn=await F.getDocs(colRef(uid,c));o[c]=sn.docs.map(d=>({id:d.id,...d.data()}))}));return o},
    listen(uid,cb){return[...COLS,"meta"].map(c=>F.onSnapshot(colRef(uid,c),{includeMetadataChanges:true},sn=>cb(c,sn.docs.map(d=>({id:d.id,...d.data()})),{hasPendingWrites:sn.metadata.hasPendingWrites}),e=>{CLOUD.err=cloudErr(e);cloudBadge()}))},
    async write(uid,ops){for(let i=0;i<ops.length;i+=400){const b=F.writeBatch(db);for(const o of ops.slice(i,i+400)){const[c,id]=(o.set||o.del).split("/");const r=F.doc(db,"users",uid,c,id);if(o.set)b.set(r,o.data);else b.delete(r)}await b.commit()}}
  };
}

function migrate(){

function limitNow(){
  const c=[{...DEF_TUFE,src:"def"}];
  const o=S.tufeOto;if(o&&+o.tufe>0&&/^\d{4}-\d{2}$/.test(o.tufeAy||""))c.push({tufe:+o.tufe,tufeAy:o.tufeAy,kaynak:o.kaynak||"",src:"oto"});
  const a=S.ayar.tufe;if(a&&+a.tufe>0)c.push({tufe:+a.tufe,tufeAy:a.tufeAy,kaynak:"Elle girildi",src:"el"});
  return c.reduce((x,y)=>y.tufeAy>=x.tufeAy?y:x);
}
async function fetchTufe(){
  try{
    const r=await fetch("tufe.json?t="+Date.now(),{cache:"no-store"});
    if(!r.ok)return;
    const d=await r.json();
    if(d&&+d.tufe>0&&/^\d{4}-\d{2}$/.test(d.tufeAy||"")){

/* ================== kira hesapları ================== */
const payDay=k=>{const g=+k.odemeGunu;if(g>=1&&g<=31)return g;const d=parseISO(k.giris);return d?d.getDate():1};
function rentAt(k,ym){
  const h=(k.gecmis||[]).slice().sort((a,b)=>a.tarih.localeCompare(b.tarih));
  let r=h.length?+h[0].eski:+k.kira||0;
  for(const x of h)if(x.tarih.slice(0,7)<=ym)r=+x.yeni;
  return r;
}
function periods(k){
  /* takip başlangıcından bu aya (veya çıkışa) kadar her ay bir kira tahakkuku */
  const start=(k.takipBas||(k.giris||"").slice(0,7)||curYM());
  let end=curYM();if(k.cikis&&k.cikis.slice(0,7)<end)end=k.cikis.slice(0,7);
  const out=[];let ym=start;let guard=0;
  while(ym<=end&&guard++<600){out.push(ym);ym=addMonths(ym,1)}
  return out;
}
const paidFor=(k,ym)=>S.odemeler.filter(o=>o.kiraciId===k.id&&o.donem===ym).reduce((s,o)=>s+(+o.tutar||0),0);
function periodState(k,ym){
  const due=rentAt(k,ym),paid=paidFor(k,ym);
  if(paid>=due-0.5)return{due,paid,st:"paid"};
  const d=parseISO(ym+"-"+pad(Math.min(payDay(k),28)));
  const late=ym<curYM()||today()>d;
  return{due,paid,st:paid>0?(late?"partlate":"part"):(late?"late":"open")};
}
function balance(k){
  let due=0,paid=0;
  for(const ym of periods(k)){
    const ps=periodState(k,ym);
    /* bu ayın ödeme günü gelmediyse henüz borç sayılmaz */
    if(ym===curYM()&&(ps.st==="open"||ps.st==="part")){paid+=ps.paid;due+=ps.paid;continue}
    due+=ps.due;paid+=ps.paid;
  }
  /* takip dışı dönemlere yapılmış ödemeleri de say */
  const pset=new Set(periods(k));
  paid+=S.odemeler.filter(o=>o.kiraciId===k.id&&!pset.has(o.donem)).reduce((s,o)=>s+(+o.tutar||0),0);
  return Math.max(0,Math.round(due-paid));
}
function lateMonths(k){return periods(k).filter(ym=>{const s=periodState(k,ym).st;return s==="late"||s==="partlate"})}
/* güncel sözleşmenin başlangıcı: zam yıldönümü ve sözleşme süresi buna göre; kiracılık süresi (5/10 yıl) ilk girişe göre */
const sozBas=k=>parseISO(k.sozBas)||parseISO(k.giris);
function anniversary(k){
  const g=sozBas(k);if(!g)return null;
  const y=NOW.getFullYear();let a=new Date(y,g.getMonth(),g.getDate());
  return a;
}
/* zam takvimi: her yıl ya da (sözleşmede öyle kararlaştırıldıysa) sözleşme süresi dolunca */
const zamAralik=k=>k.zamPer==="sozlesme"?Math.max(1,+k.sure||1):1;
function nextRaise(k){
  const g=sozBas(k);if(!g||!isActive(k))return null;
  const P=zamAralik(k),t=today();
  const at=n=>new Date(g.getFullYear()+n*P,g.getMonth(),g.getDate());
  const doneNear=a=>(k.gecmis||[]).some(h=>{const d=parseISO(h.tarih);return d&&daysBetween(a,d)>=-60&&d<=t});
  let n=1;while(at(n)<=t&&n<200)n++;
  const past=n>1?at(n-1):null;
  let a;
  if(past&&daysBetween(past,t)<=60&&!doneNear(past))a=past;          // zam günü geçti, zam girilmedi: gecikti
  else{a=at(n);if(daysBetween(t,a)<=60&&doneNear(a))a=at(n+1)}        // erken yapılmışsa bir sonrakine geç
  const last=(k.gecmis||[]).slice().sort((x,z)=>z.tarih.localeCompare(x.tarih))[0];
  return{tarih:a,gun:daysBetween(t,a),last,P};
}
function raiseInfo(k){
  const r=nextRaise(k);return r&&r.gun<=45?{tarih:r.tarih,gun:r.gun}:null;
}
function contractInfo(k){
  const g=sozBas(k),ilk=parseISO(k.sureBas)||parseISO(k.giris)||g;if(!g||!isActive(k))return null;
  const sure=Math.max(1,+k.sure||1);
  const ilkBitis=new Date(g.getFullYear()+sure,g.getMonth(),g.getDate());
  let bitis=ilkBitis;while(bitis<today())bitis=new Date(bitis.getFullYear()+1,bitis.getMonth(),bitis.getDate());
  const yil=(today()-ilk)/(365.25*864e5);
  const giris=parseISO(k.giris)||g,toplam=(today()-giris)/(365.25*864e5);
  return{bitis,gun:daysBetween(today(),bitis),yil,toplam,uzama:bitis>ilkBitis,on:yil>=10,bes:yil>=5};
}
function monthTotals(ym){
  let exp=0,col=0;
  for(const k of S.kiracilar){if(!periods(k).includes(ym))continue;exp+=rentAt(k,ym);}
  col=S.odemeler.filter(o=>o.donem===ym).reduce((s,o)=>s+(+o.tutar||0),0);
  return{exp,col};
}

function vKiracilar(){
  const q=ui.kQ.toLocaleLowerCase("tr");
  const base=S.kiracilar.filter(k=>ui.kFilter==="eski"?!isActive(k):isActive(k));
  let list=base;
  if(ui.kT)list=list.filter(k=>kTur(k)===ui.kT);
  if(ui.kAy>=0)list=list.filter(k=>{const r=nextRaise(k);return r&&r.tarih.getMonth()===ui.kAy});
  if(q)list=list.filter(k=>(k.ad+" "+kAdres(k)+" "+(k.tel||"")).toLocaleLowerCase("tr").includes(q));
  list.sort((a,b)=>a.ad.localeCompare(b.ad,"tr"));
  const nA=S.kiracilar.filter(isActive).length,nE=S.kiracilar.length-nA;
  let h=`<div class="seg">${[["aktif","Aktif",nA],["eski","Çıkanlar",nE]].map(([k,l,n])=>`<button data-f="${k}" class="${(ui.kFilter==="eski"?"eski":"aktif")===k?"on":""}">${l} <span class="num" style="opacity:.6">${n}</span></button>`).join("")}</div>`;
  h+=`<div class="chips" style="margin:0;padding:0"><button class="chip ${!ui.kT?"on":""}" data-kt="">Tümü</button>${TURLER.map(t=>{const n=base.filter(k=>kTur(k)===t).length;return`<button class="chip ${ui.kT===t?"on":""}" data-kt="${t}" ${n?"":'style="opacity:.45"'}>${t} <span class="num" style="opacity:.6">${n}</span></button>`}).join("")}</div>`;
  h+=`<div class="g2"><input class="search" id="kq" type="search" placeholder="İsim veya adres ara" value="${esc(ui.kQ)}"><select class="search" id="kAy" aria-label="Zam ayı">${opt([["-1","Zam ayı: tümü"],...AYLAR.map((a,i)=>[String(i),a+" zammı"])],String(ui.kAy))}</select></div>`;
  if(!list.length)h+=`<div class="card empty"><b>${S.kiracilar.length?"Sonuç yok":"Henüz kiracı yok"}</b>${S.kiracilar.length?"Arama veya filtreyi değiştir.":"Sağ alttaki butondan ilk kiracını ekle."}</div>`;
  else h+=`<div class="card list">${list.map(k=>{const r=nextRaise(k);
    return`<button class="item" data-open="${k.id}"><span class="av">${esc(initials(k.ad))}</span><span class="main"><b>${esc(k.ad)}</b><small>${esc([kAdres(k),kTur(k)].filter(Boolean).join(" · "))}</small></span><span class="side"><b>${TL.format(k.kira||0)}</b><small>${isActive(k)?(r?(r.gun<=30?`<span class="pill p-${r.gun<0?"bad":"warn"}">zam ${r.gun<0?"gecikti":r.gun+" gün"}</span>`:"zam "+esc(fmtShortDate(toISO(r.tarih)))):""):"çıktı "+esc(fmtShortDate(k.cikis))}</small></span></button>`}).join("")}</div>`;
  $("view").innerHTML=h;
  $("view").querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{ui.kFilter=b.dataset.f;render()});
  $("view").querySelectorAll("[data-kt]").forEach(b=>b.onclick=()=>{ui.kT=b.dataset.kt;render()});
  $("kAy").onchange=()=>{ui.kAy=+$("kAy").value;render()};
  const qi=$("kq");qi.oninput=()=>{ui.kQ=qi.value;const p=qi.selectionStart;render();const n=$("kq");n.focus();n.setSelectionRange(p,p)};
  bindCommon();
  setFab("Kiracı",()=>openKiraci());

function openMulkler(){
  const act=S.kiracilar.filter(isActive);
  const info=m=>{const ks=act.filter(k=>k.mulkId===m.id),d=parseISO(m.dask),g=d?daysBetween(today(),d):null;
    const daskSorun=!d?(m.tur!=="Arsa / diğer"):g<=30;
    return{m,ks,kira:ks.reduce((t,k)=>t+(+k.kira||0),0),g,d,daskSorun,dask:!d?(m.tur==="Arsa / diğer"?"":"DASK girilmedi"):g<0?"DASK bitti":g<=30?`DASK ${g} gün`:""}};
  const all=S.mulkler.slice().sort((a,b)=>a.ad.localeCompare(b.ad,"tr")).map(info);
  const F=[["tum","Tümü",()=>true],["dolu","Dolu",x=>x.ks.length],["bos","Boş",x=>!x.ks.length],["konut","Konut",x=>(x.m.tur||"Konut")==="Konut"],["isyeri","İş yeri",x=>x.m.tur==="İş yeri"],["dask","DASK uyarısı",x=>x.daskSorun]];
  let f=ui.mF||"tum";
  const occ=all.filter(x=>x.ks.length).length,top=all.reduce((t,x)=>t+x.kira,0);
  const bagsiz=act.filter(k=>!k.mulkId).length;

  ${all.length?`<div class="kpis"><div class="card kpi"><b class="num">%${Math.round(occ/all.length*100)}</b><span>Doluluk</span></div><div class="card kpi"><b class="num">${TL.format(top)}</b><span>Aylık kira toplamı</span></div></div>
  <div class="chips" id="mfc" style="margin:0;padding:0">${F.map(([k,l,fn])=>{const n=all.filter(fn).length;return`<button class="chip" data-mf="${k}" ${n||k==="tum"?"":'style="opacity:.45"'}>${l} <span class="num" style="opacity:.6">${n}</span></button>`}).join("")}</div>
  <div class="card list" id="mfl"></div>`:`<div class="card empty"><b>Henüz mülk yok</b>Daire, dükkân gibi mülklerini ekle; doluluk, DASK ve mülk bazında gelir-gider görünsün.</div>`}
  ${bagsiz?`<p class="hint">${bagsiz} kiracı bir mülke bağlanmamış. Kiracı kartından "Düzenle" ile mülk seçebilirsin.</p>`:""}
  <button class="btn pri" id="mAdd">${ic("plus",2)}Mülk ekle</button>`,(q,close,ov)=>{
    const draw=()=>{
      const list=all.filter(F.find(x=>x[0]===f)[2]);

      el.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{close();openMulk(b.dataset.m)});

  let y=355;

/* Tek sayfalık, içinde JPEG resim olan bir PDF'i elle oluşturur: dış kütüphane yok, internetsiz çalışır */
function jpegToPDF(jpegBytes,imgW,imgH,pageW,pageH,title){
  const enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const push=x=>{const b=typeof x==="string"?enc.encode(x):x;parts.push(b);len+=b.length};
  const obj=(n,body)=>{offs[n]=len;push(`${n} 0 obj\n`);body();push("\nendobj\n")};
  push("%PDF-1.4\n%\xE2\xE3\xCF\xD3\n");
  const content=`q ${pageW} 0 0 ${pageH} 0 0 cm /Im0 Do Q`;
  obj(1,()=>push("<< /Type /Catalog /Pages 2 0 R >>"));
  obj(2,()=>push("<< /Type /Pages /Kids [3 0 R] /Count 1 >>"));
  obj(3,()=>push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pageW} ${pageH}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`));
  obj(4,()=>{push(`<< /Type /XObject /Subtype /Image /Width ${imgW} /Height ${imgH} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpegBytes.length} >>\nstream\n`);push(jpegBytes);push("\nendstream")});
  obj(5,()=>push(`<< /Length ${content.length} >>\nstream\n${content}\nendstream`));
  const t=String(title||"").replace(/[^\x20-\x7E]/g,"").replace(/[()\\]/g,"");
  obj(6,()=>push(`<< /Title (${t}) /Producer (Kira Defteri) >>`));
  const xref=len;
  let x=`xref\n0 7\n0000000000 65535 f \n`;for(let i=1;i<=6;i++)x+=String(offs[i]).padStart(10,"0")+" 00000 n \n";
  push(x+`trailer\n<< /Size 7 /Root 1 0 R /Info 6 0 R >>\nstartxref\n${xref}\n%%EOF`);
  return new Blob(parts,{type:"application/pdf"});
}

  sheet(`<h3>${saved?"Zam bildirimi":"Zam yap"}</h3><p class="sub">${esc(k.ad)} · ${saved?"önceki kira":"şu anki kira"} ${TL.format(eski)}</p>
  ${saved?`<div class="banner" style="background:var(--ok-soft)">${ic("check",2)}<span>Zam kaydedildi: <b>${TL.format(saved.eski)} → ${TL.format(saved.yeni)}</b> (%${PCT.format(saved.oran)}), ${esc(fmtDate(saved.tarih))}</span><button id="zEdit">Düzenle</button></div>`:`
  <div class="quick" id="zQ"><button type="button" data-p="${L.tufe}">%${PCT.format(L.tufe)} TÜFE</button>${[5,10,15,20,25].map(p=>`<button type="button" data-p="${p}">%${p}</button>`).join("")}</div>
  <div class="g2"><div class="fld"><label for="zO">Oran (%)</label><input id="zO" inputmode="decimal" value="${fmtInput(oran0)}"></div>
  <div class="fld"><label for="zY">Yeni kira (₺)</label><input id="zY" class="tl" inputmode="decimal" value="${esc(fmtInput(yeni0))}"></div></div>
  <p class="hint" style="margin-top:-6px">Oranı yaz ya da yeni kirayı yaz; diğeri kendiliğinden hesaplanır.</p>
  <div class="fld"><label for="zT">Geçerlilik tarihi</label><input id="zT" type="date" value="${tarih0}"></div>
  <p class="err" id="zW"></p>`}
  <div class="fld"><label for="mT">Kiracıya gidecek mesaj</label><textarea id="mT" style="min-height:140px"></textarea></div>
  <div class="btns grow"><a class="btn wa" id="mW" target="_blank" rel="noopener">${ic("wa")}WhatsApp</a><a class="btn" id="mS">SMS</a><button class="btn" id="mC">Kopyala</button></div>
  ${saved?`<button class="btn" data-close>Kapat</button>`:`<div class="btns grow"><button class="btn" data-close>Vazgeç</button><button class="btn pri" id="zSave">Zammı kaydet</button></div>
  <p class="hint">Mesajı gönderdikten sonra "Zammı kaydet"e basmayı unutma; yeni kira ve sonraki zam tarihi buna göre güncellenir.</p>`}`,(q,close,ov)=>{
    let edited=false;
    const vals=()=>saved?{o:+saved.oran,y:+saved.yeni,t:saved.tarih}:{o:parseMoney(q("#zO").value),y:parseMoney(q("#zY").value),t:q("#zT").value};
    const upd=()=>{const v=q("#mT").value;q("#mW").href=waLink(k.tel,v);q("#mS").href=smsHref(k.tel,v)};
    const refresh=()=>{
      const {o,y,t}=vals();
      if(!saved){
        ov.querySelectorAll("#zQ [data-p]").forEach(b=>b.classList.toggle("hl",Math.abs(+b.dataset.p-o)<0.005));
        q("#zW").textContent=konut&&o>L.tufe+0.005?`Bu artış (%${PCT.format(o)}) yasal sınırın (%${PCT.format(L.tufe)}) üstünde. Kiracı kabul etmezse geçersiz sayılabilir.`:"";
      }
      if(!edited)q("#mT").value=zamMetni(k,eski,y,o,t,L);
      upd();
    };
    if(!saved){
      q("#zO").addEventListener("input",()=>{const o=parseMoney(q("#zO").value);q("#zY").value=fmtInput(Math.floor(eski*(1+o/100)));edited=false;refresh()});
      q("#zY").addEventListener("input",()=>{const y=parseMoney(q("#zY").value);const o=eski?Math.round((y/eski-1)*10000)/100:0;q("#zO").value=Math.abs(Math.floor(eski*(1+L.tufe/100))-y)<1?fmtInput(L.tufe):fmtInput(o);edited=false;refresh()});
      q("#zT").addEventListener("input",()=>{edited=false;refresh()});
      ov.querySelectorAll("#zQ [data-p]").forEach(b=>b.onclick=()=>{q("#zO").value=fmtInput(+b.dataset.p);q("#zO").dispatchEvent(new Event("input"))});
      q("#zSave").onclick=()=>{
        const {o,y,t}=vals();if(!(y>0)||!t){q("#zW").textContent="Yeni kira ve tarihi gir.";return}
        k.gecmis=k.gecmis||[];k.gecmis.push({tarih:t,eski,yeni:y,oran:eski?Math.round((y/eski-1)*10000)/100:0});
        k.kira=y;save();close();render();refreshDetail(k.id);toast("Zam kaydedildi · yeni kira "+TL.format(y));
      };
    }else{
      q("#zEdit").onclick=()=>{
        k.gecmis=(k.gecmis||[]).filter(x=>x!==saved);k.kira=+saved.eski;save();close();render();refreshDetail(k.id);
        openRaise(k.id);
        setTimeout(()=>{const zo=document.getElementById("zO"),zt=document.getElementById("zT");if(zo&&zt){zt.value=saved.tarih;zo.value=fmtInput(saved.oran);zo.dispatchEvent(new Event("input"))}},30);
      };
    }
    q("#mT").addEventListener("input",()=>{edited=true;upd()});
    q("#mC").onclick=async()=>{try{await navigator.clipboard.writeText(q("#mT").value);toast("Kopyalandı")}catch(e){q("#mT").select();toast("Seçili metni kopyala")}};
    refresh();
  });
}

/* ---------- geçmiş zam kaydı (kirayı bugünden değiştirmez, sadece geçmişi tamamlar) ---------- */
function openPastRaise(id){
  const k=kById(id);if(!k)return;
  const h=(k.gecmis||[]).slice().sort((a,b)=>a.tarih.localeCompare(b.tarih));
  const g=sozBas(k)||parseISO(k.giris);
  const lastY=h.length?+h[h.length-1].tarih.slice(0,4):(g?g.getFullYear():NOW.getFullYear()-1);
  const tarih=g?toISO(new Date(Math.min(lastY+1,NOW.getFullYear()),g.getMonth(),g.getDate())):todayISO();
  const eski=h.length?+h[h.length-1].yeni:(+k.ilkKira||"");
  sheet(`<h3>Geçmiş zam ekle</h3><p class="sub">${esc(k.ad)} · ilk giriş ${esc(fmtDate(k.giris))}</p>
  <div class="fld"><label for="pzT">Zam tarihi</label><input id="pzT" type="date" value="${tarih}" max="${todayISO()}"></div>
  <div class="g2"><div class="fld"><label for="pzE">Önceki kira (₺)</label><input id="pzE" class="tl" inputmode="decimal" value="${esc(fmtInput(eski))}"></div>
  <div class="fld"><label for="pzY">Yeni kira (₺)</label><input id="pzY" class="tl" inputmode="decimal"></div></div>
  <p class="hint" id="pzI"></p>
  <p class="err" id="pzErr"></p>
  <div class="btns grow"><button class="btn" data-close>Bitti</button><button class="btn pri" id="pzOk">Ekle ve sonrakine geç</button></div>`,(q,close)=>{
    const info=()=>{const e=parseMoney(q("#pzE").value),y=parseMoney(q("#pzY").value);q("#pzI").textContent=e&&y?`%${PCT.format(Math.round((y/e-1)*10000)/100)} artış`:"Yıllara göre sırayla eklersen bir sonraki yılın tarihi ve önceki kirası kendiliğinden dolar."};
    q("#pzE").addEventListener("input",info);q("#pzY").addEventListener("input",info);info();
    q("#pzOk").onclick=()=>{
      const t=q("#pzT").value,e=parseMoney(q("#pzE").value),y=parseMoney(q("#pzY").value);
      if(!t||!(e>0)||!(y>0)){q("#pzErr").textContent="Tarih, önceki ve yeni kirayı gir.";return}
      if(t>todayISO()){q("#pzErr").textContent="Gelecek tarihli zam için 'Zam yap'ı kullan.";return}
      k.gecmis=k.gecmis||[];k.gecmis.push({tarih:t,eski:e,yeni:y,oran:Math.round((y/e-1)*10000)/100,tur:"gecmis"});
      k.gecmis.sort((a,b)=>a.tarih.localeCompare(b.tarih));
      if(!k.ilkKira&&k.gecmis[0].tarih===t)k.ilkKira=e;
      /* en yeni kayıt buysa güncel kira da bu olur */
      if(k.gecmis[k.gecmis.length-1].tarih===t)k.kira=y;
      save();render();
      toast(`${t.slice(0,4)} zammı eklendi`);
      const d=parseISO(t);const nt=toISO(new Date(d.getFullYear()+1,d.getMonth(),d.getDate()));
      if(nt<=todayISO()){q("#pzT").value=nt;q("#pzE").value=fmtInput(y);q("#pzY").value="";q("#pzErr").textContent="";info();q("#pzY").focus()}
      else{close();refreshDetail(k.id)}
    };
    q("[data-close]").addEventListener("click",()=>setTimeout(()=>refreshDetail(k.id),50));
  });
}

/* ---------- yeni sözleşme ---------- */
function openSozlesme(id){
  const k=kById(id);if(!k)return;
  const eski=+k.kira||0,L=limitNow();
  sheet(`<h3>Yeni sözleşme</h3><p class="sub">${esc(k.ad)} · ilk giriş ${esc(fmtDate(k.giris))}</p>
  <div class="g2"><div class="fld"><label for="sB">Yeni sözleşme başlangıcı</label><input id="sB" type="date" value="${todayISO()}"></div>
  <div class="fld"><label for="sS">Süre</label><select id="sS">${opt([["1","1 yıl"],["2","2 yıl"],["3","3 yıl"],["5","5 yıl"]],String(k.sure||1))}</select></div></div>
  <div class="fld"><label for="sZP">Kira artışı</label><select id="sZP">${opt([["yillik","Her yıl (sözleşme yıldönümünde)"],["sozlesme","Sözleşme süresi dolunca"]],k.zamPer||"yillik")}</select></div>
  <div class="fld"><label for="sK">Yeni aylık kira (₺)</label><input id="sK" class="tl" inputmode="decimal" value="${esc(fmtInput(eski))}"></div>
  <div class="fld"><label for="sN">Not</label><input id="sN" placeholder="Örn. noterde yenilendi"></div>
  <p class="hint" id="sInfo"></p>
  <label class="banner info" style="cursor:pointer;align-items:flex-start"><input type="checkbox" id="sReset" checked style="width:20px;height:20px;accent-color:var(--brand);flex-shrink:0;margin-top:1px"><span><b>5 ve 10 yıl sürelerini bu sözleşmeden başlat</b><br><small style="color:var(--muted)">İşaretlersen "5 yıl doldu / 10 yıl doldu" uyarıları yeni sözleşme tarihinden sayılır. Aynı kiracıyla yapılan yeni sözleşmenin bu süreleri sıfırlayıp sıfırlamadığı hukuken tartışmalıdır; dava gibi bir adımdan önce avukata danış.</small></span></label>
  <p class="hint">Zam yıldönümü ve sözleşme bitişi artık bu tarihe göre hesaplanır. Eski ödeme ve zam kayıtları korunur.</p>
  <div class="btns grow"><button class="btn" data-close>Vazgeç</button><button class="btn pri" id="sOk">Kaydet</button></div>`,(q,close)=>{
    const sinirli=kTur(k)!=="Arsa";
    const info=()=>{const y=parseMoney(q("#sK").value),o=eski?(y/eski-1)*100:0;q("#sInfo").innerHTML=y&&y!==eski?`Kira ${TL.format(eski)} → <b>${TL.format(y)}</b> (%${PCT.format(o)})${sinirli&&o>L.tufe+0.005?` <span style="color:var(--bad)">· Yasal sınır %${PCT.format(L.tufe)}. Aynı kiracıyla yapılan yeni sözleşmede de bu sınır geçerli sayılabilir.</span>`:""}`:"Kira değişmiyor."};
    q("#sK").addEventListener("input",info);info();
    q("#sOk").onclick=()=>{
      const t=q("#sB").value,y=parseMoney(q("#sK").value),sure=+q("#sS").value;if(!t||!(y>0))return;
      k.sozlesmeler=k.sozlesmeler||[];
      if(!k.sozlesmeler.length)k.sozlesmeler.push({tarih:k.sozBas||k.giris,sure:+k.sure||1,kira:+k.ilkKira||((k.gecmis||[]).length?+(k.gecmis.slice().sort((a,b)=>a.tarih.localeCompare(b.tarih))[0].eski):(k.giris&&k.giris.slice(0,4)===String(NOW.getFullYear())?eski:null)),not:"İlk sözleşme"});
      k.sozlesmeler.push({tarih:t,sure,kira:y,not:q("#sN").value.trim()});
      if(y!==eski){k.gecmis=k.gecmis||[];k.gecmis.push({tarih:t,eski,yeni:y,oran:eski?Math.round((y/eski-1)*10000)/100:0,tur:"sozlesme"});k.kira=y}
      k.sozBas=t;k.sure=sure;k.zamPer=q("#sZP").value;
      if(q("#sReset").checked)k.sureBas=t;else delete k.sureBas;
      save();close();render();refreshDetail(k.id);toast("Yeni sözleşme kaydedildi");
    };
  });
}

/* ---------- mesaj ---------- */
function openZamMesaj(id){openRaise(id)}
function msgTemplates(k,ym){
  ym=ym||curYM();
  const first=String(k.ad).split(" ")[0],b=balance(k),late=lateMonths(k),ps=periodState(k,ym);
  const iban=S.ayar.iban?`\nIBAN: ${S.ayar.iban}${S.ayar.ad?" ("+S.ayar.ad+")":""}`:"";
  const sig=S.ayar.ad?`\n${S.ayar.ad}`:"";
  const lastPay=S.odemeler.filter(o=>o.kiraciId===k.id).sort((x,y)=>y.tarih.localeCompare(x.tarih)||(y.ts||0)-(x.ts||0))[0];
  const kalan=Math.max(0,ps.due-ps.paid);
  return{
    hat:{l:"Hatırlatma",t:`Merhaba ${first}, ${ymLabel(ym)} kira ödemesi${kalan?` (${TL.format(kalan)})`:""} için hatırlatma yapmak istedim. Ödeme günü ayın ${payDay(k)}'i.${iban}\nİyi günler.${sig}`},
    gec:{l:"Gecikme",t:`Merhaba ${first}, ${late.length?late.map(ymLabel).join(", ")+" dönemine ait ":""}toplam ${TL.format(b)} kira ödemeniz gecikmiş görünüyor. En kısa sürede ödeme yapabilir veya bilgi verebilir misiniz?${iban}\nTeşekkürler.${sig}`},
    kis:{l:"Kısmi ödeme",t:`Merhaba ${first}, ${ymLabel(ym)} kirası için ${TL.format(ps.paid)} ödemeniz ulaştı, teşekkürler. Kalan ${TL.format(kalan)} tutarı da en kısa sürede gönderebilirseniz sevinirim.${iban}${sig}`},
    tes:{l:"Ödeme alındı",t:lastPay?`Merhaba ${first}, ${ymLabel(lastPay.donem)} kirası için ${TL.format(lastPay.tutar)} ödemeniz ${trDate(lastPay.tarih)} tarihinde ulaştı. Teşekkür ederim.${sig}`:`Merhaba ${first}, kira ödemeniz ulaştı, teşekkür ederim.${sig}`}
  };
}
const defaultMsg=(k,ym)=>{const ps=periodState(k,ym||curYM());return balance(k)>0?"gec":ps.st==="part"||ps.st==="partlate"?"kis":ps.st==="paid"?"tes":"hat"};
function smsHref(tel,v){return`sms:${telLink(tel)}${/iPhone|iPad/.test(navigator.userAgent)?"&":"?"}body=${encodeURIComponent(v)}`}
function openMessage(id,start,ym){
  const k=kById(id);if(!k)return;
  if(start==="zam"){openZamMesaj(id);return}
  const T=msgTemplates(k,ym);
  let cur=start&&T[start]?start:defaultMsg(k,ym);
  sheet(`<h3>Tahsilat bildirimi</h3><p class="sub">${esc(k.ad)} · ${esc(k.tel||"telefon yok")}</p><div class="chips" style="margin:0;padding:0">${Object.entries(T).map(([key,v])=>`<button class="chip" data-m="${key}">${v.l}</button>`).join("")}</div><div class="fld"><textarea id="mT" style="min-height:150px"></textarea></div><div class="btns grow"><button class="btn" id="mC">Kopyala</button><a class="btn wa" id="mW" target="_blank" rel="noopener">${ic("wa")}WhatsApp</a><a class="btn" id="mS">SMS</a></div>`,(q)=>{
    const set=key=>{cur=key;q("#mT").value=T[key].t;q(".chips").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.m===key));upd()};
    const upd=()=>{const v=q("#mT").value;q("#mW").href=waLink(k.tel,v);q("#mS").href=smsHref(k.tel,v)};
    q(".chips").querySelectorAll("button").forEach(b=>b.onclick=()=>set(b.dataset.m));
    q("#mT").oninput=upd;
    q("#mC").onclick=async()=>{try{await navigator.clipboard.writeText(q("#mT").value);toast("Kopyalandı")}catch(e){q("#mT").select();toast("Seçili metni kopyala")}};
    set(cur);
  });
}
/* toplu hatırlatma: WhatsApp tek tek gönderdiği için kişiler sırayla gösterilir */
function openBulkMsg(ym,list){
  if(!list.length){toast("Bildirim gidecek kiracı yok");return}
  let i=0;const sent=new Set();
  sheet(`<h3>Toplu bildirim</h3><p class="sub">${esc(ymLabel(ym))} · ${list.length} kiracı</p><div id="bm"></div>`,(q,close)=>{
    const draw=()=>{
      const k=list[i],T=msgTemplates(k,ym),key=defaultMsg(k,ym),txt=T[key].t;
      q("#bm").innerHTML=`<div class="calc" style="margin-bottom:10px"><span><b style="font-size:16px">${esc(k.ad)}</b><br><small style="color:var(--muted)">${esc(T[key].l)} · ${esc(k.tel||"telefon yok")}</small></span><b style="font-size:15px">${i+1} / ${list.length}</b></div>
      <div class="fld"><textarea id="bmT" style="min-height:140px">${esc(txt)}</textarea></div>
      ${k.tel?"":`<p class="err">Bu kiracının telefonu kayıtlı değil; metni kopyalayıp başka yoldan gönderebilirsin.</p>`}
      <div class="btns grow" style="margin-top:10px"><button class="btn" id="bmP" ${i?"":"disabled"}>‹ Önceki</button>${k.tel?`<a class="btn wa" id="bmW" target="_blank" rel="noopener">${ic("wa")}${sent.has(k.id)?"Tekrar gönder":"Gönder"}</a>`:`<button class="btn" id="bmC">Kopyala</button>`}<button class="btn ${i===list.length-1?"pri":""}" id="bmN">${i===list.length-1?"Bitti":"Sonraki ›"}</button></div>`;
      const ta=q("#bmT"),w=q("#bmW");
      const upd=()=>{if(w)w.href=waLink(k.tel,ta.value)};ta.oninput=upd;upd();
      if(w)w.addEventListener("click",()=>{sent.add(k.id);setTimeout(()=>{if(i<list.length-1){i++;draw()}},400)});
      q("#bmC")&&(q("#bmC").onclick=async()=>{try{await navigator.clipboard.writeText(ta.value);toast("Kopyalandı")}catch(e){}});
      q("#bmP").onclick=()=>{if(i>0){i--;draw()}};
      q("#bmN").onclick=()=>{if(i<list.length-1){i++;draw()}else{close();toast(`${sent.size} kişiye bildirim açıldı`)}};
    };
    draw();
  });
}

/* ================== TAHSİLAT ================== */
function vTahsilat(){
  const ym=ui.tYM||curYM();
  const rows=S.kiracilar.filter(k=>periods(k).includes(ym)&&(!ui.tM||k.mulkId===ui.tM)).sort((a,b)=>a.ad.localeCompare(b.ad,"tr"));
  const {exp,col}=ui.tM?{exp:rows.reduce((t,k)=>t+rentAt(k,ym),0),col:S.odemeler.filter(o=>o.donem===ym&&rows.some(k=>k.id===o.kiraciId)).reduce((t,o)=>t+(+o.tutar||0),0)}:monthTotals(ym);
  let h=`<div class="monthnav"><button class="iconbtn" id="tPrev" aria-label="Önceki ay">${ic("left")}</button><b>${esc(ymLabel(ym))}</b><button class="iconbtn" id="tNext" aria-label="Sonraki ay" ${ym>=curYM()?"disabled style='opacity:.4'":""}>${ic("right")}</button></div>`;
  if(S.mulkler.length)h+=`<div class="fld"><select id="tM" aria-label="Mülk filtresi"><option value="">Tüm mülkler</option>${opt(S.mulkler.slice().sort((a,b)=>a.ad.localeCompare(b.ad,"tr")).map(m=>[m.id,m.ad]),ui.tM||"")}</select></div>`;
  h+=`<div class="kpis"><div class="card kpi ok"><b class="num">${TL.format(col)}</b><span>Tahsil edilen</span></div><div class="card kpi ${exp-col>0?"bad":""}"><b class="num">${TL.format(Math.max(0,exp-col))}</b><span>Kalan · beklenen ${TL.format(exp)}</span></div></div>`;
  const acik=rows.filter(k=>periodState(k,ym).st!=="paid");
  if(acik.length>1)h+=`<div class="btns grow"><button class="btn ok" id="bulk">${ic("check",2)}Toplu tahsilat · ${acik.length}</button><button class="btn wa" id="bulkMsg">${ic("wa")}Toplu bildirim · ${acik.length}</button></div>`;
  else if(acik.length===1)h+=`<button class="btn wa" id="bulkMsg" style="width:100%">${ic("wa")}Bildirim gönder · ${esc(acik[0].ad)}</button>`;
  const odenen=rows.filter(k=>periodState(k,ym).st==="paid");
  const tf=ui.tF||(acik.length?"acik":"tum");
  const shown=tf==="acik"?acik:tf==="odendi"?odenen:rows;
  if(rows.length)h+=`<div class="seg">${[["acik","Bekleyen",acik.length],["odendi","Ödenen",odenen.length],["tum","Tümü",rows.length]].map(([k,l,n])=>`<button data-tf="${k}" class="${tf===k?"on":""}">${l} <span class="num" style="opacity:.6">${n}</span></button>`).join("")}</div>`;
  if(!rows.length)h+=`<div class="card empty"><b>Bu ay için kayıt yok</b>Bu ayda takipte olan kiracı bulunmuyor.</div>`;
  else if(!shown.length)h+=`<div class="card banner" style="background:var(--ok-soft)">${ic("check",2)}<span>${tf==="acik"?"Bu ayın tüm kiraları tahsil edildi.":"Bu ay henüz ödeme yok."}</span></div>`;
  else h+=`<div class="card list">${shown.map(k=>{const s=periodState(k,ym);const map={paid:["ok","Ödendi","p-ok"],part:["warn","Kısmi","p-warn"],partlate:["bad","Kısmi · gecikti","p-bad"],late:["bad","Gecikti","p-bad"],open:["","Bekleniyor","p-info"]}[s.st];
    return`<div class="item"><span class="av ${map[0]}" data-open="${k.id}" style="cursor:pointer">${s.st==="paid"?ic("check",2):esc(initials(k.ad))}</span><span class="main" data-open="${k.id}" style="cursor:pointer"><b>${esc(k.ad)}</b><small><span class="pill ${map[2]}">${map[1]}</span> ${s.paid&&s.st!=="paid"?TL.format(s.paid)+" / ":""}${TL.format(s.due)} · gün ${payDay(k)}</small></span><span class="act"><button class="btn sm" data-tmsg="${k.id}" aria-label="Bildirim gönder" title="Bildirim gönder">${ic("wa")}</button>${s.st==="paid"?"":`<button class="btn sm ok" data-pay="${k.id}" data-ym="${ym}">Tahsil</button>`}</span></div>`}).join("")}</div>`;
  const pays=S.odemeler.filter(o=>o.tarih.slice(0,7)===ym).sort((a,b)=>b.tarih.localeCompare(a.tarih));
  if(pays.length){

function vGiderler(){
  const yil=ui.gYil||String(NOW.getFullYear());

  if(ui.gMulk)list=list.filter(g=>g.mulkId===ui.gMulk);
  const ayCnt=Array(12).fill(0);list.forEach(g=>ayCnt[+g.tarih.slice(5,7)-1]++);
  if(ui.gAy>=0)list=list.filter(g=>+g.tarih.slice(5,7)-1===ui.gAy);
  list.sort((a,b)=>b.tarih.localeCompare(a.tarih));
  const top=list.reduce((s,g)=>s+(+g.tutar||0),0);
  const byCat={};list.forEach(g=>byCat[g.tur]=(byCat[g.tur]||0)+(+g.tutar||0));
  const years=[...new Set([String(NOW.getFullYear()),...S.giderler.map(g=>g.tarih.slice(0,4))])].sort().reverse();

  h+=`<div class="card pad" style="display:flex;justify-content:space-between;align-items:baseline;gap:10px"><span style="color:var(--muted)">${ui.gAy>=0?AYLAR[ui.gAy]+" "+yil:yil} toplam gider</span><b class="num" style="font-size:22px">${TL.format(top)}</b></div>`;

/* ================== RAPOR ================== */
function vRapor(){
  const yil=ui.rYil||String(NOW.getFullYear());
  const years=[...new Set([String(NOW.getFullYear()),...S.odemeler.map(o=>o.tarih.slice(0,4)),...S.giderler.map(g=>g.tarih.slice(0,4))])].sort().reverse();
  const inc=Array(12).fill(0),exp=Array(12).fill(0);
  S.odemeler.forEach(o=>{if(o.tarih.startsWith(yil))inc[+o.tarih.slice(5,7)-1]+=+o.tutar||0});
  S.giderler.forEach(g=>{if(g.tarih.startsWith(yil))exp[+g.tarih.slice(5,7)-1]+=+g.tutar||0});
  const ti=inc.reduce((a,b)=>a+b,0),te=exp.reduce((a,b)=>a+b,0);
  let h=`<div class="chips">${years.map(y=>`<button class="chip ${y===yil?"on":""}" data-y="${y}">${y}</button>`).join("")}</div>`;
  h+=`<div class="kpis"><div class="card kpi ok"><b class="num">${TL.format(ti)}</b><span>Tahsilat</span></div><div class="card kpi"><b class="num">${TL.format(te)}</b><span>Gider</span></div><div class="card kpi" style="grid-column:1/-1"><b class="num" style="font-size:24px">${TL.format(ti-te)}</b><span>Net gelir · ${yil}</span></div></div>`;
  /* grafik */
  const max=Math.max(1,...inc,...exp),W=340,H=170,pl=4,pb=18,bw=(W-pl*2)/12;
  const nice=v=>v>=1e6?PCT.format(Math.round(v/1e5)/10)+"M":v>=1e3?Math.round(v/1e3)+"b":String(Math.round(v));
  let bars="";
  for(let i=0;i<12;i++){
    const x=pl+i*bw,hi=(H-pb-14)*inc[i]/max,he=(H-pb-14)*exp[i]/max,w=(bw-6)/2;
    bars+=`<rect x="${x+2}" y="${H-pb-hi}" width="${w}" height="${Math.max(hi,inc[i]?2:0)}" rx="2" fill="var(--brand)"><title>${AYLAR[i]} tahsilat ${TL.format(inc[i])}</title></rect>`;
    bars+=`<rect x="${x+2+w+2}" y="${H-pb-he}" width="${w}" height="${Math.max(he,exp[i]?2:0)}" rx="2" fill="var(--warn)"><title>${AYLAR[i]} gider ${TL.format(exp[i])}</title></rect>`;
    bars+=`<text x="${x+bw/2}" y="${H-4}" text-anchor="middle">${AYK[i].slice(0,3)}</text>`;
  }
  h+=`<section class="sec"><div class="sechd"><h2>Aylık tahsilat ve gider</h2></div><div class="card pad"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${yil} aylık tahsilat ve gider grafiği"><line x1="0" x2="${W}" y1="${H-pb}" y2="${H-pb}" stroke="var(--line)"/><text x="${W-2}" y="10" text-anchor="end">en yüksek ${nice(max)}</text>${bars}</svg><div class="legend"><span><i style="background:var(--brand)"></i>Tahsilat</span><span><i style="background:var(--warn)"></i>Gider</span></div></div></section>`;
  /* mülk bazında */
  if(S.mulkler.length){
    const rows=S.mulkler.map(m=>{const ks=S.kiracilar.filter(k=>k.mulkId===m.id).map(k=>k.id);const i=S.odemeler.filter(o=>o.tarih.startsWith(yil)&&ks.includes(o.kiraciId)).reduce((s,o)=>s+(+o.tutar||0),0);const e=S.giderler.filter(g=>g.tarih.startsWith(yil)&&g.mulkId===m.id).reduce((s,g)=>s+(+g.tutar||0),0);return{m,i,e}});
    h+=`<section class="sec"><div class="sechd"><h2>Mülk bazında</h2></div><div class="card" style="overflow-x:auto"><table><thead><tr><th>Mülk</th><th class="r">Gelir</th><th class="r">Gider</th><th class="r">Net</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.m.ad)}</td><td class="r">${TL.format(r.i)}</td><td class="r">${TL.format(r.e)}</td><td class="r">${TL.format(r.i-r.e)}</td></tr>`).join("")}</tbody></table></div></section>`;
  }
  /* beyan özeti */
  const konutIds=new Set(S.kiracilar.filter(k=>{const m=mById(k.mulkId);return !m||m.tur==="Konut"}).map(k=>k.id));
  const konut=S.odemeler.filter(o=>o.tarih.startsWith(yil)&&konutIds.has(o.kiraciId)).reduce((s,o)=>s+(+o.tutar||0),0);
  const isyeri=ti-konut;
  h+=`<section class="sec"><div class="sechd"><h2>Vergi beyanı için özet</h2></div><div class="card pad"><dl class="kv"><dt>Konut kira geliri</dt><dd class="num">${TL.format(konut)}</dd><dt>İş yeri kira geliri</dt><dd class="num">${TL.format(isyeri)}</dd><dt>Belgelenen giderler</dt><dd class="num">${TL.format(te)}</dd></dl><p class="hint" style="margin-top:10px">${yil} yılı kira gelirleri ertesi yılın Mart ayında beyan edilir. Konut istisnası tutarı her yıl değiştiği ve hangi giderlerin düşülebileceği yönteme bağlı olduğu için beyan öncesi Gelir İdaresi'nin güncel rehberine veya bir mali müşavire bakmanı öneririm.</p></div></section>`;
  h+=`<section class="sec"><div class="sechd"><h2>Dışa aktar</h2></div><div class="btns grow"><button class="btn" id="xAll">${ic("doc")}Excel raporu</button><button class="btn" id="xBak">Yedek al</button></div></section>`;
  $("view").innerHTML=h;
  $("view").querySelectorAll("[data-y]").forEach(b=>b.onclick=()=>{ui.rYil=b.dataset.y;render()});
  $("xAll").onclick=()=>exportExcel(yil);
  $("xBak").onclick=backup;
  setFab(null);
}

/* ---------- yedek ---------- */
async function shareOrDownload(blob,name){
  const file=new File([blob],name,{type:blob.type});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:name});return true}catch(e){if(e&&e.name==="AbortError")return false}
  }
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);return true;
}
async function backup(){
  const data={...S,_app:"kira-defteri",_surum:VERSION,_tarih:new Date().toISOString()};
  const ok=await shareOrDownload(new Blob([JSON.stringify(data,null,1)],{type:"application/json"}),`kira-defteri-yedek-${todayISO()}.json`);
  if(ok){S.ayar.sonYedek=todayISO();save();render();toast("Yedek hazır")}
}
function restore(file,closeSettings){
  const r=new FileReader();
  r.onload=async()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d||!Array.isArray(d.kiracilar))throw 0;
      if(!await confirmSheet("Yedek yüklensin mi?",`Yedekte ${d.kiracilar.length} kiracı, ${(d.odemeler||[]).length} tahsilat var. Şu anki tüm veriler bu yedekle değiştirilecek.`,"Yükle",false))return;
      const keepPin=S.ayar.pinHash;
      if(CLOUD.user&&!await confirmSheet("Bulut da güncellenecek","Hesabındaki bulut verileri de bu yedekle değiştirilecek.","Devam",false))return;
      S={...blank(),...d,ayar:{...blank().ayar,...(d.ayar||{})}};
      delete S._app;delete S._surum;delete S._tarih;
      if(!S.ayar.pinHash)S.ayar.pinHash=keepPin;
      S.cloudUid=CLOUD.user?CLOUD.user.uid:(d.cloudUid||"");
      save();applyTheme();closeAllSheets();render();toast("Yedek yüklendi");
    }catch(e){toast("Bu dosya geçerli bir yedek değil")}
  };
  r.readAsText(file);
}

/* ---------- Excel ---------- */
let xlsxP=null;
function loadXLSX(){
  if(window.XLSX)return Promise.resolve(window.XLSX);
  if(!xlsxP)xlsxP=new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js";s.onload=()=>res(window.XLSX);s.onerror=()=>{xlsxP=null;rej(new Error("x"))};document.head.appendChild(s)});
  return xlsxP;
}
async function saveXlsx(name,sheets){
  try{
    const X=await loadXLSX();const wb=X.utils.book_new();
    for(const [n,rows] of sheets){const ws=X.utils.aoa_to_sheet(rows);ws["!cols"]=rows[0].map((_,i)=>({wch:Math.min(40,Math.max(10,...rows.map(r=>String(r[i]??"").length+2)))}));X.utils.book_append_sheet(wb,ws,n)}
    const out=X.write(wb,{bookType:"xlsx",type:"array"});
    await shareOrDownload(new Blob([out],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}),name);
  }catch(e){toast("Excel hazırlanamadı. İnternet bağlantısını kontrol et.")}
}
function exportExcel(opts){
  const k=[["Ad Soyad","Telefon","Adres / Daire","Tür","Giriş Tarihi","Son Sözleşme","Sözleşme (yıl)","Zam","Aylık Kira","Sonraki Zam","Durum","Çıkış","Not"]];
  S.kiracilar.slice().sort((a,b)=>a.ad.localeCompare(b.ad,"tr")).forEach(x=>{const r=nextRaise(x);k.push([x.ad,x.tel||"",kAdres(x),kTur(x),trDate(x.giris),trDate(x.sozBas||x.giris),+x.sure||1,x.zamPer==="sozlesme"?"Sözleşme bitince":"Her yıl",+x.kira||0,r?trDate(toISO(r.tarih)):"",isActive(x)?"Aktif":"Çıktı",trDate(x.cikis),x.not||""])});
  const sheets=[["Kiracılar",k]];
  if(opts&&opts.zam){
    const z=[["Kiracı","Adres / Daire","Zam Tarihi","Önceki Kira","Yeni Kira","Artış %","Not"]];
    S.kiracilar.slice().sort((a,b)=>a.ad.localeCompare(b.ad,"tr")).forEach(x=>(x.gecmis||[]).slice().sort((a,b)=>a.tarih.localeCompare(b.tarih)).forEach(h=>z.push([x.ad,kAdres(x),trDate(h.tarih),+h.eski,+h.yeni,+h.oran,h.tur==="sozlesme"?"Yeni sözleşme":h.tur==="gecmis"?"Geçmiş kayıt":""])));
    sheets.push(["Zam Geçmişi",z]);
  }
  saveXlsx(`kiracilar-${todayISO()}.xlsx`,sheets);
}
function openExport(){
  const n=S.kiracilar.reduce((t,x)=>t+(x.gecmis||[]).length,0);
  sheet(`<h3>Excel'e indir</h3><p class="sub">${S.kiracilar.length} kiracı</p>
  <label class="banner info" style="cursor:pointer"><input type="checkbox" id="xZ" ${n?"":"disabled"} style="width:20px;height:20px;accent-color:var(--brand);flex-shrink:0"><span><b>Zam geçmişini de ekle</b><br><small style="color:var(--muted)">${n?`${n} zam kaydı ayrı bir sayfada listelenir`:"Henüz zam kaydı yok"}</small></span></label>
  <div class="btns grow"><button class="btn" data-close>Vazgeç</button><button class="btn pri" id="xOk">İndir</button></div>`,(q,close)=>{
    q("#xOk").onclick=()=>{const z=q("#xZ").checked;close();exportExcel({zam:z})};
  });
}
function downloadTemplate(){saveXlsx("kiraci-sablonu.xlsx",[["Kiracılar",[["Ad Soyad","Adres / Daire","Tür","Giriş Tarihi","Aylık Kira","Telefon","Not"],["Örnek Kişi","A Blok D:3","Konut","15.03.2023",15000,"0555 000 00 00","Bu satırı silip kendi kiracılarını yaz"]]]])}
const norm=s=>String(s??"").toLocaleLowerCase("tr").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/ı/g,"i").replace(/[^a-z0-9]/g,"");
async function importExcel(file,closeSettings){
  let X;try{X=await loadXLSX()}catch(e){toast("Excel okuyucu yüklenemedi. İnternet gerekli.");return}
  const buf=await file.arrayBuffer();
  let rows;try{const wb=X.read(buf,{type:"array",cellDates:true});rows=X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:""})}catch(e){toast("Dosya okunamadı");return}
  let hi=rows.findIndex(r=>r.some(c=>/ad|isim|kiraci/.test(norm(c))));if(hi<0){toast("Başlık satırı bulunamadı");return}
  const hd=rows[hi].map(norm);
  const col=(...keys)=>hd.findIndex(h=>keys.some(k=>h.includes(k)));
  const c={ad:col("adsoyad","isim","kiraci","ad"),tur:col("tur","tip"),mulk:col("mulk","daire","adres"),giris:col("giris","baslangic"),kira:col("kira","tutar"),dep:col("depozito","teminat"),gun:col("odemegun","gun"),tel:col("telefon","tel","gsm"),not:col("not","aciklama"),sure:col("sozlesme","sure"),cikis:col("cikis")};
  const out=[];
  for(const r of rows.slice(hi+1)){
    const ad=String(r[c.ad]??"").trim();if(!ad||/^ornek/.test(norm(ad)))continue;
    out.push({ad,tur:c.tur>=0?String(r[c.tur]||"").trim():"",mulk:c.mulk>=0?String(r[c.mulk]||"").trim():"",giris:c.giris>=0?parseAnyDate(r[c.giris]):"",kira:c.kira>=0?parseMoney(r[c.kira]):0,dep:c.dep>=0?parseMoney(r[c.dep]):0,gun:c.gun>=0?parseInt(r[c.gun],10)||"":"",tel:c.tel>=0?String(r[c.tel]||"").trim():"",not:c.not>=0?String(r[c.not]||"").trim():"",sure:c.sure>=0?parseInt(r[c.sure],10)||1:1,cikis:c.cikis>=0?parseAnyDate(r[c.cikis]):""});
  }
  if(!out.length){toast("Aktarılacak satır bulunamadı");return}
  const bad=out.filter(o=>!o.giris||!(o.kira>0)).length;
  if(!await confirmSheet(`${out.length} kiracı aktarılsın mı?`,`${bad?bad+" satırda giriş tarihi veya kira eksik; onları sonra düzenleyebilirsin. ":""}Aynı isimde kayıt varsa atlanır.`,"Aktar",false))return;
  let n=0;
  for(const o of out){
    if(S.kiracilar.some(k=>norm(k.ad)===norm(o.ad)))continue;
    const tn=norm(o.tur),tur=/isyeri|dukkan|ofis|is/.test(tn)?"İş yeri":/arsa|tarla/.test(tn)?"Arsa":"Konut";
    S.kiracilar.push({id:uid(),ad:o.ad,tel:o.tel,adres:o.mulk,tur,giris:o.giris||todayISO(),sure:o.sure,kira:o.kira,odemeGunu:o.gun,depozito:o.dep||"",takipBas:curYM(),not:o.not,cikis:o.cikis,gecmis:[]});n++;
  }
  save();closeAllSheets();render();toast(n+" kiracı aktarıldı");
}

/* ================== PIN ================== */
async function hashPin(p){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("kd:"+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function pinPad(title,onDone,cancelable){
  const el=document.createElement("div");el.className="lock";
  let v="";
  el.innerHTML=`<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="var(--brand)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><h2 id="lt">${esc(title)}</h2><div class="dots" id="ld">${"<i></i>".repeat(4)}</div><div class="pad3">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-n="${n}">${n}</button>`).join("")}<button class="t" data-x="c">${cancelable?"Vazgeç":""}</button><button data-n="0">0</button><button class="t" data-x="b">Sil</button></div>`;
  document.body.appendChild(el);
  const dots=()=>el.querySelectorAll("#ld i").forEach((d,i)=>d.classList.toggle("f",i<v.length));
  const api={el,reset(msg,ok){if(!ok){v="";dots()}if(msg)el.querySelector("#lt").textContent=msg;el.querySelector("#lt").style.color=ok?"":"var(--bad)";if(ok)return;const d=el.querySelector("#ld");d.classList.remove("shake");void d.offsetWidth;d.classList.add("shake");if(navigator.vibrate)navigator.vibrate(120)},close(){el.remove();document.removeEventListener("keydown",kd)}};
  const press=n=>{if(v.length>=4)return;v+=n;dots();if(v.length===4){const p=v;v="";setTimeout(dots,150);onDone(p,api)}};
  el.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>press(b.dataset.n));
  el.querySelector('[data-x="b"]').onclick=()=>{v=v.slice(0,-1);dots()};
  el.querySelector('[data-x="c"]').onclick=()=>{if(cancelable)api.close()};
  const kd=e=>{if(/^\d$/.test(e.key))press(e.key);else if(e.key==="Backspace"){v=v.slice(0,-1);dots()}};
  document.addEventListener("keydown",kd);
  return api;
}
let locked=false;
function lockIfNeeded(){return;
  if(!S.ayar.pinHash||locked)return;
  locked=true;
  pinPad("PIN gir",async(p,api)=>{if(await hashPin(p)===S.ayar.pinHash){api.close();locked=false}else api.reset("Yanlış PIN, tekrar dene")},false);
}
function openPinSetup(){
  const setNew=()=>{let first="";pinPad("Yeni PIN belirle (4 hane)",async(p,api)=>{
    if(!first){first=p;api.reset("Aynı PIN'i tekrar gir",true);return}
    if(p!==first){first="";api.reset("Eşleşmedi, baştan gir");return}
    S.ayar.pinHash=await hashPin(p);save();api.close();toast("PIN kilidi açıldı");
  },true)};
  if(!S.ayar.pinHash){confirmSheet("PIN kilidi açılsın mı?","Açarsan uygulama her açılışta 4 haneli bir şifre sorar. Şifreyi unutursan sadece yedekten geri dönebilirsin. İstemiyorsan Vazgeç'e bas.","PIN belirle",false).then(ok=>{if(ok)setNew()});return}
  sheet(`<h3>PIN kilidi</h3><p class="hint">PIN'i unutursan uygulamaya giremezsin; o durumda tarayıcı verisini silip yedekten yüklemen gerekir.</p><div class="btns grow"><button class="btn" id="pc">PIN'i değiştir</button><button class="btn danger" id="po">Kilidi kapat</button></div>`,(q,close)=>{
    q("#pc").onclick=()=>{close();pinPad("Mevcut PIN",async(p,api)=>{if(await hashPin(p)!==S.ayar.pinHash){api.reset("Yanlış PIN");return}api.close();setNew()},true)};
    q("#po").onclick=()=>{close();pinPad("Mevcut PIN",async(p,api)=>{if(await hashPin(p)!==S.ayar.pinHash){api.reset("Yanlış PIN");return}S.ayar.pinHash="";save();api.close();toast("PIN kilidi kapatıldı")},true)};
  });
}
let hiddenAt=0;
document.addEventListener("visibilitychange",()=>{
  if(document.hidden)hiddenAt=Date.now();
  else{if(S.ayar.pinHash&&Date.now()-hiddenAt>3*60*1000)lockIfNeeded();if(Date.now()-hiddenAt>60*60*1000)fetchTufe();render();checkUpdate()}
});

/* ---------- otomatik güncelleme ---------- */
let swReg=null,updShown=false;
const verNum=v=>String(v).split(".").map(n=>+n||0).reduce((a,n)=>a*1000+n,0);
async function checkUpdate(){
  if(location.protocol==="file:"||!navigator.onLine)return;
  try{swReg&&swReg.update().catch(()=>{})}catch(e){}
  try{
    const r=await fetch("version.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)return;
    const v=String((await r.json()).v||"");
    if(!v||verNum(v)<=verNum(VERSION))return;
    let tried="";try{tried=sessionStorage.getItem("updTried")||""}catch(e){}
    /* uygulama boştayken (açık form yok, kilit yok) hemen yenile; sunucu henüz yeni dosyayı vermiyorsa döngüye girmemek için oturumda bir kez */
    if(tried!==v&&!sheetStack&&!document.querySelector(".lock")){try{sessionStorage.setItem("updTried",v)}catch(e){}location.reload();return}
    if(updShown)return;updShown=true;
    const b=document.createElement("div");b.className="banner info";b.style.cssText="position:fixed;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:70;box-shadow:0 6px 20px rgba(0,0,0,.15)";
    b.innerHTML=`${ic("up")}<span>Yeni sürüm hazır (${esc(v)}).</span><button>Güncelle</button>`;
    b.querySelector("button").onclick=()=>location.reload();document.body.appendChild(b);
  }catch(e){}
}

/* ================== başlat ================== */
load();applyTheme();
try{const t=sessionStorage.getItem("tab");if(t&&TABS.some(x=>x[0]===t))tab=t}catch(e){}
$("btnSettings").onclick=openSettings;
$("cloudBtn").onclick=openAccount;
render();
lockIfNeeded();
fetchTufe();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if("serviceWorker" in navigator&&location.protocol!=="file:")navigator.serviceWorker.register("sw.js").then(r=>{swReg=r}).catch(()=>{});
setTimeout(checkUpdate,1500);
cloudBadge();cloudStart();
window.addEventListener("storage",e=>{if(e.key===KEY){load();render()}});
</script>
