<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kira Defteri</title>
<meta name="description" content="Kiracı, tahsilat, gider ve kira artışı takibi">
<meta name="theme-color" content="#1d3b8f" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1218" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kira Defteri">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --bg:#f2f3f7; --surface:#ffffff; --surface2:#f7f8fb; --fg:#151a26; --muted:#5f6779; --faint:#8a91a2; --line:#e3e6ee;
  --brand:#1d3b8f; --brand-2:#2f56c4; --brand-soft:#e7ecfb; --on-brand:#ffffff;
  --ok:#17784a; --ok-soft:#e2f4ea; --warn:#a85410; --warn-soft:#fdf0e2; --bad:#b42318; --bad-soft:#fde8e6;
  --shadow:0 1px 2px rgba(20,26,40,.06),0 4px 14px rgba(20,26,40,.05);
  --r:14px; --nav-h:64px;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1218; --surface:#181c25; --surface2:#1e232e; --fg:#e9ecf2; --muted:#a0a7b8; --faint:#7a8296; --line:#2a303d;
  --brand:#8fa8ff; --brand-2:#a9bbff; --brand-soft:#1f2848; --on-brand:#0d1330;
  --ok:#6fd39f; --ok-soft:#14301f; --warn:#f2a65e; --warn-soft:#352414; --bad:#f4877d; --bad-soft:#3a1b19;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1218; --surface:#181c25; --surface2:#1e232e; --fg:#e9ecf2; --muted:#a0a7b8; --faint:#7a8296; --line:#2a303d;
  --brand:#8fa8ff; --brand-2:#a9bbff; --brand-soft:#1f2848; --on-brand:#0d1330;
  --ok:#6fd39f; --ok-soft:#14301f; --warn:#f2a65e; --warn-soft:#352414; --bad:#f4877d; --bad-soft:#3a1b19;
  --shadow:none; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* header */
.hdr{position:sticky;top:0;z-index:10;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));display:flex;align-items:center;gap:12px}
.hdr h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.02em;flex:1;min-width:0}
.hdr small{display:block;font-size:13px;color:var(--muted);font-weight:400;letter-spacing:0}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex-shrink:0}
.iconbtn svg{width:20px;height:20px}
main{max-width:760px;margin:0 auto;padding:4px max(16px,env(safe-area-inset-right)) calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 90px) max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:18px}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:15;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav div{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--faint)}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--brand)}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 14px);z-index:14;height:52px;padding:0 20px 0 16px;border-radius:16px;border:0;background:var(--brand);color:var(--on-brand);font-weight:600;display:flex;align-items:center;gap:8px;box-shadow:0 6px 20px rgba(29,59,143,.3)}
.fab svg{width:20px;height:20px}

/* blocks */
.sec{display:flex;flex-direction:column;gap:10px}
.sechd{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sechd h2{margin:0;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.sechd button{border:0;background:none;color:var(--brand);font-weight:600;font-size:14px;padding:4px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:14px 16px}
.hero{background:linear-gradient(135deg,#1d3b8f,#2f56c4);color:#fff;border:0;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
:root[data-theme="dark"] .hero{background:linear-gradient(135deg,#1c2a5c,#26407f)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero{background:linear-gradient(135deg,#1c2a5c,#26407f)}}
.hero .lbl{font-size:13px;opacity:.85}
.hero .big{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.hero .row{display:flex;justify-content:space-between;gap:10px;font-size:13px;opacity:.92}
.hero .bar{height:8px;background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden}
.hero .bar i{display:block;height:100%;background:#7ff0b2;border-radius:99px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{padding:12px 14px;min-width:0}
.kpi b{display:block;font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi span{font-size:12.5px;color:var(--muted)}
.kpi.bad b{color:var(--bad)} .kpi.ok b{color:var(--ok)}
.limit{display:flex;align-items:center;gap:12px;padding:12px 14px}
.limit .pct{font-size:20px;font-weight:700;color:var(--brand);font-variant-numeric:tabular-nums}
.limit .txt{flex:1;min-width:0;font-size:13px;color:var(--muted)}
.limit .txt b{display:block;color:var(--fg);font-size:14px}
.limit.stale{border-color:var(--warn)}
.banner{padding:12px 14px;border-radius:var(--r);font-size:14px;display:flex;gap:10px;align-items:center}
.banner.warn{background:var(--warn-soft)} .banner.info{background:var(--brand-soft)}
.banner span{flex:1}
.item>svg{width:18px;height:18px;flex-shrink:0;color:var(--faint)}
.banner>svg{width:22px;height:22px;flex-shrink:0}
.limit>svg{width:18px;height:18px;flex-shrink:0;color:var(--faint)}
a.btn{text-decoration:none;color:inherit}
button.card{font:inherit;color:inherit}
.banner button{border:0;background:var(--surface);border-radius:10px;padding:7px 12px;font-weight:600;font-size:13px}

.list{display:flex;flex-direction:column}
.list>.item+.item{border-top:1px solid var(--line)}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left;background:none;border:0}
.item .av{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:15px;flex-shrink:0;background:var(--brand-soft);color:var(--brand)}
.item .av.bad{background:var(--bad-soft);color:var(--bad)} .item .av.warn{background:var(--warn-soft);color:var(--warn)} .item .av.ok{background:var(--ok-soft);color:var(--ok)}
.item .av svg{width:20px;height:20px}
.item .main{flex:1;min-width:0}
.item .main b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .main small{display:block;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .side{text-align:right;flex-shrink:0}
.item .side b{display:block;font-weight:600;font-variant-numeric:tabular-nums}
.item .side small{font-size:12px;color:var(--muted)}
.item .act{display:flex;gap:6px;flex-shrink:0}
.pill{display:inline-block;font-size:11.5px;font-weight:700;border-radius:99px;padding:2px 8px;white-space:nowrap}
.p-bad{background:var(--bad-soft);color:var(--bad)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-ok{background:var(--ok-soft);color:var(--ok)} .p-info{background:var(--brand-soft);color:var(--brand)} .p-mute{background:var(--surface2);color:var(--muted)}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);margin-bottom:4px;font-size:16px}
.empty button{margin-top:12px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px}
.btn.sm{min-height:34px;padding:6px 11px;font-size:13px;border-radius:10px}
.btn.pri{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.wa{background:#1f9d55;color:#fff;border-color:#1f9d55}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.ghost{border-color:transparent;background:transparent;color:var(--brand)}
.btn svg{width:18px;height:18px}
.btn:disabled{opacity:.5}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns.end{justify-content:flex-end}
.btns.grow>*{flex:1}

.seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:7px 8px;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 13px;font-size:13.5px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.search{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.monthnav{display:flex;align-items:center;gap:8px}
.monthnav b{flex:1;text-align:center;font-size:16px}

/* sheet */
.ov{position:fixed;inset:0;z-index:40;background:rgba(8,10,18,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:600px;max-height:92vh;max-height:92dvh;overflow-y:auto;border-radius:20px 20px 0 0;padding:8px max(18px,env(safe-area-inset-right)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 2px;flex-shrink:0}
.sheet h3{margin:0;font-size:20px;letter-spacing:-.01em}
.sheet .sub{margin:-8px 0 0;color:var(--muted);font-size:14px}
@media (min-width:680px){.ov{align-items:center}.sheet{border-radius:20px}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .2s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.5}}}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label{font-size:13px;color:var(--muted);font-weight:600}
.fld input,.fld select,.fld textarea{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);font-size:16px}
.fld textarea{min-height:70px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g2>*{min-width:0}
.hint{font-size:13px;color:var(--muted);margin:0}
.err{font-size:14px;color:var(--bad);margin:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;overflow-wrap:anywhere}
.calc{background:var(--brand-soft);border-radius:var(--r);padding:14px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.calc b{font-size:24px;font-variant-numeric:tabular-nums}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 11px;font-weight:600;font-size:13.5px}
.quick button.hl{border-color:var(--brand);color:var(--brand)}
.grid12{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.grid12 button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 2px;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.grid12 button small{font-size:10.5px;font-weight:500;color:var(--muted)}
.grid12 .paid{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.grid12 .part{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.grid12 .owed{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.grid12 .na{opacity:.4}
.grid12 .paid small,.grid12 .part small,.grid12 .owed small{color:inherit}

/* chart */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--sans)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tfoot td{font-weight:700;border-bottom:0}

/* lock */
.lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px}
.lock h2{margin:0;font-size:20px}
.dots{display:flex;gap:14px}
.dots i{width:14px;height:14px;border-radius:99px;border:2px solid var(--brand)}
.dots i.f{background:var(--brand)}
.dots.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pad3{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
.pad3 button{touch-action:manipulation;user-select:none;-webkit-user-select:none;height:72px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:26px;font-weight:500}
.pad3 button.t{border:0;background:none;font-size:15px;color:var(--brand);font-weight:600}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 80px);z-index:60;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:90vw;text-align:center}

/* receipt */
.rcpt{border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;background:var(--surface)}
.rcpt .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.rcpt .top b{font-size:18px}
.rcpt .amt{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.rcpt .sig{display:flex;justify-content:space-between;gap:20px;margin-top:20px;font-size:13px;color:var(--muted)}
.rcpt .sig div{flex:1;border-top:1px solid var(--muted);padding-top:6px;text-align:center}
#printArea{display:none}
@media print{
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important;padding:20px;color:#000}
  #printArea .rcpt{border:1px solid #999;background:#fff;color:#000}
  #printArea .sig div{border-color:#000;color:#000}
}
</style>
</head>
<body>
<header class="hdr">
  <h1 id="title">Özet<small id="subtitle"></small></h1>
  <button class="iconbtn" id="btnSettings" aria-label="Ayarlar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
</header>
<main id="view"></main>
<button class="fab" id="fab" hidden></button>
<nav class="nav"><div id="nav"></div></nav>
<div id="sheetRoot"></div>
<div id="printArea"></div>

<script>
"use strict";
/* ================== sabitler ================== */
const VERSION="1.3.0";
const KEY="kira-defteri-v1";
const AYLAR=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const AYK=["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];
/* Uygulamayla gelen son bilinen oran. tufe.json daha yenisini getirir. */
const DEF_TUFE={tufe:31.49,tufeAy:"2026-10",kaynak:"TÜİK (Eylül 2026 verisi)"};
const GIDER_TUR=["Aidat","Emlak vergisi","Tamir / bakım","DASK / sigorta","Fatura","Komisyon","Diğer"];
const YONTEM=["Havale / EFT","Nakit","Diğer"];
const TL=new Intl.NumberFormat("tr-TR",{style:"currency",currency:"TRY",maximumFractionDigits:0});
const TL2=new Intl.NumberFormat("tr-TR",{style:"currency",currency:"TRY",maximumFractionDigits:2});
const PCT=new Intl.NumberFormat("tr-TR",{maximumFractionDigits:2});
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);

/* ================== tarih ================== */
let NOW=new Date();
const pad=n=>String(n).padStart(2,"0");
const ymOf=(y,m)=>y+"-"+pad(m+1);
const curYM=()=>ymOf(NOW.getFullYear(),NOW.getMonth());
const todayISO=()=>NOW.getFullYear()+"-"+pad(NOW.getMonth()+1)+"-"+pad(NOW.getDate());
function parseISO(s){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||"");return m?new Date(+m[1],+m[2]-1,+m[3]):null}
const toISO=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
function addMonths(ym,n){let[y,m]=ym.split("-").map(Number);m=m-1+n;y+=Math.floor(m/12);m=((m%12)+12)%12;return ymOf(y,m)}
const ymLabel=ym=>{const[y,m]=ym.split("-");return AYLAR[+m-1]+" "+y};
const ymShort=ym=>{const[y,m]=ym.split("-");return AYK[+m-1]+" "+y.slice(2)};
const fmtDate=s=>{const d=parseISO(s);return d?d.toLocaleDateString("tr-TR",{day:"numeric",month:"long",year:"numeric"}):"—"};
const fmtShortDate=s=>{const d=parseISO(s);return d?d.getDate()+" "+AYK[d.getMonth()]+" "+d.getFullYear():"—"};
const trDate=s=>s?s.split("-").reverse().join("."):"";
const daysBetween=(a,b)=>Math.round((b-a)/864e5);
const today=()=>new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate());
function parseAnyDate(v){
  if(v==null||v==="")return "";
  if(v instanceof Date&&!isNaN(v))return toISO(v);
  if(typeof v==="number"){const d=new Date(Math.round((v-25569)*864e5));return toISO(new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()))}
  const s=String(v).trim();let m;
  if(m=/^(\d{4})[-./](\d{1,2})[-./](\d{1,2})/.exec(s))return toISO(new Date(+m[1],+m[2]-1,+m[3]));
  if(m=/^(\d{1,2})[-./](\d{1,2})[-./](\d{2,4})/.exec(s)){let y=+m[3];if(y<100)y+=2000;return toISO(new Date(y,+m[2]-1,+m[1]))}
  return "";
}
function parseMoney(v){
  if(typeof v==="number")return v;
  let s=String(v??"").replace(/[^\d.,-]/g,"");if(!s)return 0;
  if(s.includes(",")&&s.includes("."))s=s.replace(/\./g,"").replace(",",".");
  else if(s.includes(",")){s=/,\d{1,2}$/.test(s)?s.replace(",","."):s.replace(/,/g,"")}
  else if(/\.\d{3}(\.|$)/.test(s))s=s.replace(/\./g,"");
  return parseFloat(s)||0;
}

/* ================== kira hesapları ================== */
const payDay=k=>{const g=+k.odemeGunu;if(g>=1&&g<=31)return g;const d=parseISO(k.giris);return d?d.getDate():1};
function rentAt(k,ym){
  const h=(k.gecmis||[]).slice().sort((a,b)=>a.tarih.localeCompare(b.tarih));
  let r=h.length?+h[0].eski:+k.kira||0;
  for(const x of h)if(x.tarih.slice(0,7)<=ym)r=+x.yeni;
  return r;
}
function periods(k){
  /* takip başlangıcından bu aya (veya çıkışa) kadar her ay bir kira tahakkuku */
  const start=(k.takipBas||(k.giris||"").slice(0,7)||curYM());
  let end=curYM();if(k.cikis&&k.cikis.slice(0,7)<end)end=k.cikis.slice(0,7);
  const out=[];let ym=start;let guard=0;
  while(ym<=end&&guard++<600){out.push(ym);ym=addMonths(ym,1)}
  return out;
}
const paidFor=(k,ym)=>S.odemeler.filter(o=>o.kiraciId===k.id&&o.donem===ym).reduce((s,o)=>s+(+o.tutar||0),0);
function periodState(k,ym){
  const due=rentAt(k,ym),paid=paidFor(k,ym);
  if(paid>=due-0.5)return{due,paid,st:"paid"};
  const d=parseISO(ym+"-"+pad(Math.min(payDay(k),28)));
  const late=ym<curYM()||today()>d;
  return{due,paid,st:paid>0?(late?"partlate":"part"):(late?"late":"open")};
}
function balance(k){
  let due=0,paid=0;
  for(const ym of periods(k)){
    const ps=periodState(k,ym);
    /* bu ayın ödeme günü gelmediyse henüz borç sayılmaz */
    if(ym===curYM()&&(ps.st==="open"||ps.st==="part")){paid+=ps.paid;due+=ps.paid;continue}
    due+=ps.due;paid+=ps.paid;
  }
  /* takip dışı dönemlere yapılmış ödemeleri de say */
  const pset=new Set(periods(k));
  paid+=S.odemeler.filter(o=>o.kiraciId===k.id&&!pset.has(o.donem)).reduce((s,o)=>s+(+o.tutar||0),0);
  return Math.max(0,Math.round(due-paid));
}
function lateMonths(k){return periods(k).filter(ym=>{const s=periodState(k,ym).st;return s==="late"||s==="partlate"})}
function anniversary(k){
  const g=parseISO(k.giris);if(!g)return null;
  const y=NOW.getFullYear();let a=new Date(y,g.getMonth(),g.getDate());
  return a;
}
function raiseInfo(k){
  /* yıldönümüne 45 gün kala ya da geçtiyse bu yıl zam yapılmamışsa uyar */
  const g=parseISO(k.giris);if(!g||!isActive(k))return null;
  const y=NOW.getFullYear();if(g.getFullYear()>=y)return null;
  const a=new Date(y,g.getMonth(),g.getDate());const d=daysBetween(today(),a);
  const done=(k.gecmis||[]).some(h=>h.tarih.slice(0,4)===String(y));
  if(done)return null;
  if(d<=45&&d>=-60)return{tarih:a,gun:d};
  return null;
}
function nextRaise(k){
  /* bu yılki yıldönümü geçtiyse ve zam girilmediyse 60 güne kadar "gecikti" sayılır, yoksa bir sonraki yıldönümü */
  const g=parseISO(k.giris);if(!g||!isActive(k))return null;
  const y=NOW.getFullYear();let a=new Date(y,g.getMonth(),g.getDate());
  const done=(k.gecmis||[]).some(h=>h.tarih.slice(0,4)===String(y));
  const d=daysBetween(today(),a);
  if(a.getFullYear()<=g.getFullYear())a=new Date(g.getFullYear()+1,g.getMonth(),g.getDate());
  else if(d<0&&(done||d<-60))a=new Date(y+1,g.getMonth(),g.getDate());
  else if(d>=0&&done)a=new Date(y+1,g.getMonth(),g.getDate());
  const last=(k.gecmis||[]).slice().sort((x,z)=>z.tarih.localeCompare(x.tarih))[0];
  return{tarih:a,gun:daysBetween(today(),a),last};
}
function contractInfo(k){
  const g=parseISO(k.giris);if(!g||!isActive(k))return null;
  const sure=Math.max(1,+k.sure||1);
  const ilkBitis=new Date(g.getFullYear()+sure,g.getMonth(),g.getDate());
  let bitis=ilkBitis;while(bitis<today())bitis=new Date(bitis.getFullYear()+1,bitis.getMonth(),bitis.getDate());
  const yil=(today()-g)/(365.25*864e5);
  return{bitis,gun:daysBetween(today(),bitis),yil,uzama:bitis>ilkBitis,on:yil>=10,bes:yil>=5};
}
function monthTotals(ym){
  let exp=0,col=0;
  for(const k of S.kiracilar){if(!periods(k).includes(ym))continue;exp+=rentAt(k,ym);}
  col=S.odemeler.filter(o=>o.donem===ym).reduce((s,o)=>s+(+o.tutar||0),0);
  return{exp,col};
}

   }}
  todo.sort((a,b)=>a.o-b.o);
  h+=`<section class="sec"><div class="sechd"><h2>Yapılacaklar</h2></div>`;
  if(!S.kiracilar.length)h+="";
  else if(!todo.length)h+=`<div class="card banner" style="background:var(--ok-soft)">${ic("check",2)}<span>Her şey yolunda. Gecikmiş ödeme veya biten sigorta yok.</span></div>`;
  else h+=`<div class="card list">${todo.map((x,i)=>x.m?`<div class="item"><span class="av ${x.cls}">${ic("building")}</span><span class="main" data-mulk="${x.m.id}" style="cursor:pointer"><b>${esc(x.m.ad)}</b><small><span class="pill p-${x.cls}">${esc(x.t)}</span> ${esc(x.s)}</small></span><span class="act">${x.a==="renew"?`<button class="btn sm pri" data-renew="${x.m.id}" data-f="${x.f}">Güncelle</button>`:`<button class="btn sm ok" data-tax="${x.m.id}">Ödendi</button>`}</span></div>`:`<div class="item"><span class="av ${x.cls==="info"?"":x.cls==="mute"?"":x.cls}">${x.a==="raise"?ic("up"):x.a==="open"?ic("doc"):initials(x.k.ad)}</span><span class="main" data-open="${x.k.id}" style="cursor:pointer"><b>${esc(x.k.ad)}</b><small><span class="pill p-${x.cls}">${esc(x.t)}</span> ${esc(x.s)}</small></span><span class="act">${x.a==="pay"?`<button class="btn sm ok" data-pay="${x.k.id}">Tahsil</button>`:x.a==="raise"?`<button class="btn sm pri" data-raise="${x.k.id}">Zam</button>`:""}</span></div>`).join("")}</div>`;
  h+=`</section>`;

  /* son hareketler */
  const son=S.odemeler.slice().sort((a,b)=>b.tarih.localeCompare(a.tarih)||(b.ts||0)-(a.ts||0)).slice(0,5);
  if(son.length)h+=`<section class="sec"><div class="sechd"><h2>Son tahsilatlar</h2><button id="allPay">Tümü</button></div><div class="card list">${son.map(payRow).join("")}</div></section>`;
  $("view").innerHTML=h;
  bindCommon();
  $("bLimit").onclick=openTufe;
  $("zAll")&&($("zAll").onclick=()=>{ui.zAll=!ui.zAll;render()});
  $("view").querySelectorAll("[data-mulk]").forEach(b=>b.onclick=()=>openMulk(b.dataset.mulk));
  $("view").querySelectorAll("[data-renew]").forEach(b=>b.onclick=()=>openMulk(b.dataset.renew,null,b.dataset.f));
  $("view").querySelectorAll("[data-tax]").forEach(b=>b.onclick=()=>openGider(null,{tur:"Emlak vergisi",mulkId:b.dataset.tax}));
  $("eM")&&($("eM").onclick=()=>openMulk());
  $("eK")&&($("eK").onclick=()=>openKiraci());
  $("bYedek")&&($("bYedek").onclick=backup);
  $("allPay")&&($("allPay").onclick=()=>go("tahsilat"));
  setFab("Tahsilat",()=>openPay());
}
const fmtShort=d=>d.getDate()+" "+AYLAR[d.getMonth()];
function payRow(o){const k=kById(o.kiraciId);return`<button class="item" data-rcpt="${o.id}"><span class="av ok">${ic("check",2)}</span><span class="main"><b>${esc(k?k.ad:"Silinmiş kiracı")}</b><small>${esc(ymLabel(o.donem))} · ${esc(fmtShortDate(o.tarih))} · ${esc(o.yontem||"")}</small></span><span class="side"><b>${TL.format(o.tutar)}</b><small>Makbuz</small></span></button>`}
function bindCommon(){
  const v=$("view");
  v.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openDetail(b.dataset.open));
  v.querySelectorAll("[data-pay]").forEach(b=>b.onclick=e=>{e.stopPropagation();openPay(b.dataset.pay,b.dataset.ym)});
  v.querySelectorAll("[data-raise]").forEach(b=>b.onclick=e=>{e.stopPropagation();openRaise(b.dataset.raise)});
  v.querySelectorAll("[data-rcpt]").forEach(b=>b.onclick=()=>openReceipt(b.dataset.rcpt));
}

/* ================== KİRACILAR ================== */
function vKiracilar(){
  const q=ui.kQ.toLocaleLowerCase("tr");
  let list=S.kiracilar.filter(k=>ui.kFilter==="aktif"?isActive(k):ui.kFilter==="borclu"?isActive(k)&&balance(k)>0:!isActive(k));
  if(ui.kAy>=0)list=list.filter(k=>{const d=parseISO(k.giris);return d&&d.getMonth()===ui.kAy});
  if(q)list=list.filter(k=>(k.ad+" "+(mById(k.mulkId)?.ad||"")+" "+(k.tel||"")).toLocaleLowerCase("tr").includes(q));
  list.sort((a,b)=>a.ad.localeCompare(b.ad,"tr"));
  const n={aktif:S.kiracilar.filter(isActive).length,borclu:S.kiracilar.filter(k=>isActive(k)&&balance(k)>0).length,eski:S.kiracilar.filter(k=>!isActive(k)).length};
  let h=`<div class="seg" role="tablist">${[["aktif","Aktif"],["borclu","Borçlu"],["eski","Çıkanlar"]].map(([k,l])=>`<button data-f="${k}" class="${ui.kFilter===k?"on":""}">${l} <span class="num" style="opacity:.6">${n[k]}</span></button>`).join("")}</div>`;
  {const base=S.kiracilar.filter(k=>ui.kFilter==="aktif"?isActive(k):ui.kFilter==="borclu"?isActive(k)&&balance(k)>0:!isActive(k));
   const cnt=Array(12).fill(0);base.forEach(k=>{const d=parseISO(k.giris);if(d)cnt[d.getMonth()]++});
   h+=`<div class="sechd" style="margin-bottom:-6px"><h2>Zam ayı (giriş ayı)</h2>${ui.kAy>=0?`<button data-ay="-1">Temizle</button>`:""}</div><div class="chips"><button class="chip ${ui.kAy<0?"on":""}" data-ay="-1">Tüm aylar</button>${AYK.map((a,i)=>`<button class="chip ${ui.kAy===i?"on":""}" data-ay="${i}" ${cnt[i]?"":'style="opacity:.45"'}>${a}${cnt[i]?` <span class="num" style="opacity:.6">${cnt[i]}</span>`:""}</button>`).join("")}</div>`;}
  h+=`<input class="search" id="kq" type="search" placeholder="İsim, mülk veya telefon ara" value="${esc(ui.kQ)}">`;
  if(!list.length)h+=`<div class="card empty"><b>${S.kiracilar.length?"Sonuç yok":"Henüz kiracı yok"}</b>${S.kiracilar.length?(ui.kAy>=0?`${AYLAR[ui.kAy]} ayında zammı olan kiracı yok.`:"Arama veya filtreyi değiştir."):"Sağ alttaki butondan ilk kiracını ekle."}</div>`;
  else h+=`<div class="card list">${list.map(k=>{
    const b=balance(k),m=mById(k.mulkId),ps=isActive(k)?periodState(k,curYM()):null;
    let pill=!isActive(k)?`<span class="pill p-mute">Çıktı ${esc(fmtShortDate(k.cikis))}</span>`:b>0?`<span class="pill p-bad">${TL.format(b)} borç</span>`:ps&&ps.st==="paid"?`<span class="pill p-ok">Bu ay ödendi</span>`:`<span class="pill p-info">Ödeme günü ${payDay(k)}</span>`;
    return`<button class="item" data-open="${k.id}"><span class="av ${b>0&&isActive(k)?"bad":""}">${esc(initials(k.ad))}</span><span class="main"><b>${esc(k.ad)}</b><small>${esc(m?m.ad:"Mülk seçilmedi")} · ${TL.format(k.kira||0)}/ay${(()=>{const r=nextRaise(k);return r?" · zam "+(r.gun<0?"gecikti":r.gun<=45?r.gun+" gün":fmtShortDate(toISO(r.tarih))):""})()}</small></span><span class="side">${pill}</span></button>`}).join("")}</div>`;
  /* mülkler */
  h+=`<section class="sec"><div class="sechd"><h2>Mülkler</h2><button id="addM">+ Mülk ekle</button></div>`;
  if(!S.mulkler.length)h+=`<div class="card empty" style="padding:18px">Daire, dükkân gibi mülklerini eklersen doluluk ve mülk bazında gelir-gider raporu görürsün.</div>`;
  else h+=`<div class="card list">${S.mulkler.slice().sort((a,b)=>a.ad.localeCompare(b.ad,"tr")).map(m=>{const k=S.kiracilar.find(x=>x.mulkId===m.id&&isActive(x));return`<button class="item" data-mulk="${m.id}"><span class="av">${ic("building")}</span><span class="main"><b>${esc(m.ad)}</b><small>${esc(m.tur||"Konut")}${(()=>{const d=parseISO(m.dask);if(!d)return m.tur==="Konut"||!m.tur?" · DASK girilmedi":"";const g=daysBetween(today(),d);return g<0?" · <span class=\"pill p-bad\">DASK bitti</span>":g<=30?` · <span class="pill p-warn">DASK ${g} gün</span>`:" · DASK "+esc(fmtShortDate(m.dask))})()}</small></span><span class="side">${k?`<span class="pill p-ok">Dolu</span><small style="display:block">${esc(k.ad)}</small>`:`<span class="pill p-warn">Boş</span>`}</span></button>`}).join("")}</div>`;
  h+=`</section>`;
  $("view").innerHTML=h;
  $("view").querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{ui.kFilter=b.dataset.f;render()});
  $("view").querySelectorAll("[data-ay]").forEach(b=>b.onclick=()=>{ui.kAy=+b.dataset.ay;render()});
  {const on=$("view").querySelector('.chip.on[data-ay]');if(on&&ui.kAy>=0)on.scrollIntoView({inline:"center",block:"nearest"})}
  const qi=$("kq");qi.oninput=()=>{ui.kQ=qi.value;const p=qi.selectionStart;render();const n=$("kq");n.focus();n.setSelectionRange(p,p)};
  $("addM").onclick=()=>openMulk();
  $("view").querySelectorAll("[data-mulk]").forEach(b=>b.onclick=()=>openMulk(b.dataset.mulk));
  bindCommon();
  setFab("Kiracı",()=>openKiraci());
}

function openKiraci(id){
  const k=id?kById(id):null,d=k||{};
  sheet(`<h3>${k?"Kiracıyı düzenle":"Yeni kiracı"}</h3>
  <div class="fld"><label for="fAd">Ad soyad</label><input id="fAd" value="${esc(d.ad)}" autocomplete="off"></div>
  <div class="g2"><div class="fld"><label for="fTel">Telefon</label><input id="fTel" type="tel" inputmode="tel" value="${esc(d.tel)}" placeholder="05xx xxx xx xx"></div>
  <div class="fld"><label for="fTc">TC kimlik no</label><input id="fTc" inputmode="numeric" value="${esc(d.tc)}" maxlength="11"></div></div>
  <div class="fld"><label for="fMulk">Mülk</label><select id="fMulk"><option value="">Seçilmedi</option>${opt(S.mulkler.map(m=>[m.id,m.ad]),d.mulkId||"")}<option value="__new">+ Yeni mülk ekle…</option></select></div>
  <div class="g2"><div class="fld"><label for="fGiris">Giriş tarihi</label><input id="fGiris" type="date" value="${esc(d.giris||todayISO())}"></div>
  <div class="fld"><label for="fSure">Sözleşme süresi</label><select id="fSure">${opt([["1","1 yıl"],["2","2 yıl"],["3","3 yıl"],["5","5 yıl"]],String(d.sure||1))}</select></div></div>
  <div class="g2"><div class="fld"><label for="fKira">Aylık kira (₺)</label><input id="fKira" inputmode="decimal" value="${esc(fmtInput(d.kira))}"></div>
  <div class="fld"><label for="fGun">Ödeme günü</label><input id="fGun" inputmode="numeric" value="${esc(d.odemeGunu||"")}" placeholder="Giriş günü"></div></div>
  <div class="g2"><div class="fld"><label for="fDep">Depozito (₺)</label><input id="fDep" inputmode="decimal" value="${esc(fmtInput(d.depozito))}"></div>
  <div class="fld"><label for="fTakip">Ödeme takibi başlangıcı</label><input id="fTakip" type="month" value="${esc(d.takipBas||curYM())}"></div></div>
  <p class="hint">Takip başlangıcından önceki aylar borç olarak sayılmaz. Eski bir kiracıyı ekliyorsan bu ayı bırak.</p>
  <div class="fld"><label for="fNot">Not</label><textarea id="fNot">${esc(d.not)}</textarea></div>
  <p class="err" id="fErr"></p>
  <div class="btns grow"><button class="btn" data-close>Vazgeç</button><button class="btn pri" id="fSave">Kaydet</button></div>`,(q,close)=>{
    q("#fMulk").onchange=()=>{if(q("#fMulk").value==="__new"){openMulk(null,m=>{const s=q("#fMulk");s.insertAdjacentHTML("afterbegin",`<option value="${esc(m.id)}">${esc(m.ad)}</option>`);s.value=m.id})}};
    q("#fSave").onclick=()=>{
      const ad=q("#fAd").value.trim(),kira=parseMoney(q("#fKira").value),giris=q("#fGiris").value;
      if(!ad){q("#fErr").textContent="Ad soyad gerekli.";return}
      if(!giris){q("#fErr").textContent="Giriş tarihi gerekli.";return}
      if(!(kira>0)){q("#fErr").textContent="Aylık kirayı yaz.";return}
      const gun=parseInt(q("#fGun").value,10);
      const mulk=q("#fMulk").value==="__new"?"":q("#fMulk").value;
      const rec={...(k||{id:uid(),gecmis:[],olusturma:todayISO()}),ad,tel:q("#fTel").value.trim(),tc:q("#fTc").value.trim(),mulkId:mulk,giris,sure:+q("#fSure").value,kira,odemeGunu:gun>=1&&gun<=31?gun:"",depozito:parseMoney(q("#fDep").value)||"",takipBas:q("#fTakip").value||curYM(),not:q("#fNot").value.trim()};
      if(k)Object.assign(k,rec);else S.kiracilar.push(rec);
      save();close();render();toast(k?"Güncellendi":"Kiracı eklendi");
      if(k)refreshDetail(k.id);
    };
  });
}

function openMulk(id,onCreated,focusField){
  const m=id?mById(id):null,d=m||{};
  const kir=m?S.kiracilar.filter(k=>k.mulkId===m.id):[];
  sheet(`<h3>${m?"Mülk":"Yeni mülk"}</h3>
  <div class="fld"><label for="mAd">Mülk adı</label><input id="mAd" value="${esc(d.ad)}" placeholder="Örn. Çankaya 3+1, Daire 5"></div>
  <div class="g2"><div class="fld"><label for="mTur">Tür</label><select id="mTur">${opt(["Konut","İş yeri","Arsa / diğer"],d.tur||"Konut")}</select></div>
  <div class="fld"><label for="mAidat">Aylık aidat (₺)</label><input id="mAidat" inputmode="decimal" value="${esc(fmtInput(d.aidat))}"></div></div>
  <div class="fld"><label for="mAdres">Adres</label><textarea id="mAdres">${esc(d.adres)}</textarea></div>
  <div class="g2"><div class="fld"><label for="mTapu">Ada / parsel</label><input id="mTapu" value="${esc(d.tapu)}"></div>
  <div class="fld"><label for="mDask">DASK bitişi</label><input id="mDask" type="date" value="${esc(d.dask)}"></div></div>
  <div class="g2"><div class="fld"><label for="mSig">Konut sigortası bitişi</label><input id="mSig" type="date" value="${esc(d.sigorta)}"></div><div class="fld"><label for="mPol">Poliçe no / şirket</label><input id="mPol" value="${esc(d.police)}"></div></div>
  <p class="hint">DASK ve sigorta bitişine 1 ay kala Özet'te uyarı çıkar. Yeniledikten sonra yeni bitiş tarihini buraya gir.</p>
  ${m&&kir.length?`<p class="hint">Bu mülkte ${kir.length} kiracı kaydı var: ${kir.map(k=>esc(k.ad)).join(", ")}</p>`:""}
  <p class="err" id="mErr"></p>
  <div class="btns grow">${m?`<button class="btn danger" id="mDel">Sil</button>`:`<button class="btn" data-close>Vazgeç</button>`}<button class="btn pri" id="mSave">Kaydet</button></div>`,(q,close)=>{
    if(focusField){const el=q(focusField==="dask"?"#mDask":"#mSig");if(el){el.scrollIntoView({block:"center"});el.style.outline="2px solid var(--brand)"}}
    q("#mSave").onclick=()=>{
      const ad=q("#mAd").value.trim();if(!ad){q("#mErr").textContent="Mülk adı gerekli.";return}
      const rec={...(m||{id:uid()}),ad,tur:q("#mTur").value,aidat:parseMoney(q("#mAidat").value)||"",adres:q("#mAdres").value.trim(),tapu:q("#mTapu").value.trim(),dask:q("#mDask").value,sigorta:q("#mSig").value,police:q("#mPol").value.trim()};
      if(m)Object.assign(m,rec);else S.mulkler.push(rec);
      save();close();render();toast("Kaydedildi");if(!m&&onCreated)onCreated(rec);
    };
    q("#mDel")&&(q("#mDel").onclick=async()=>{
      if(!await confirmSheet("Mülk silinsin mi?",kir.length?"Kiracı kayıtları silinmez, sadece mülk bağlantısı kalkar.":"Bu işlem geri alınamaz.","Sil",true))return;
      S.mulkler=S.mulkler.filter(x=>x.id!==m.id);S.kiracilar.forEach(k=>{if(k.mulkId===m.id)k.mulkId=""});
      S.giderler.forEach(g=>{if(g.mulkId===m.id)g.mulkId=""});
      save();close();render();toast("Silindi");
    });
  });
}

/* ---------- kiracı detayı ---------- */
let detailClose=null,detailId=null;
function refreshDetail(id){if(detailClose&&detailId===id){detailClose();openDetail(id)}}
function openDetail(id){
  const k=kById(id);if(!k)return;
  const m=mById(k.mulkId),b=balance(k),c=contractInfo(k),L=limitNow(),r=raiseInfo(k);
  const ps=periods(k),last=ps.slice(-12);
  const allPays=S.odemeler.filter(o=>o.kiraciId===k.id).sort((a,b)=>b.tarih.localeCompare(a.tarih));
  const grid=last.map(ym=>{const s=periodState(k,ym);const cls=s.st==="paid"?"paid":s.st==="late"?"owed":s.st==="partlate"||s.st==="part"?"part":"";const[y,mo]=ym.split("-");return`<button data-ym="${ym}" class="${cls}" title="${esc(ymLabel(ym))}">${AYK[+mo-1]}<small>${s.st==="paid"?"✓":s.paid?Math.round(s.paid/1000)+"b":"’"+y.slice(2)}</small></button>`}).join("");
  const hist=(k.gecmis||[]).slice().sort((a,b)=>b.tarih.localeCompare(a.tarih));
  detailId=id;
  detailClose=sheet(`
  <div style="display:flex;gap:12px;align-items:center"><span class="item" style="padding:0;width:auto"><span class="av ${b>0?"bad":""}" style="width:52px;height:52px;font-size:18px">${esc(initials(k.ad))}</span></span><div style="min-width:0;flex:1"><h3 style="overflow-wrap:anywhere">${esc(k.ad)}</h3><p class="sub" style="margin:2px 0 0">${esc(m?m.ad:"Mülk seçilmedi")}${isActive(k)?"":" · Çıktı"}</p></div></div>
  <div class="kpis"><div class="card kpi ${b>0?"bad":"ok"}"><b class="num">${TL.format(b)}</b><span>${b>0?"Gecikmiş borç":"Borcu yok"}</span></div><div class="card kpi"><b class="num">${TL.format(k.kira||0)}</b><span>Aylık kira · gün ${payDay(k)}</span></div></div>
  ${!r&&nextRaise(k)?`<div class="banner info">${ic("up")}<span>Sonraki zam: ${esc(fmtDate(toISO(nextRaise(k).tarih)))} (${nextRaise(k).gun} gün). Şu anki sınırla en fazla ${TL.format(Math.floor((k.kira||0)*(1+L.tufe/100)))}</span><button data-r>Hesapla</button></div>`:""}${r?`<div class="banner info">${ic("up")}<span>${r.gun<0?"Zam zamanı geldi":r.gun+" gün sonra yıldönümü"}. Sınır %${PCT.format(L.tufe)} → en fazla ${TL.format(Math.floor((k.kira||0)*(1+L.tufe/100)))}</span><button data-r>Zam yap</button></div>`:""}
  <div class="btns grow">${isActive(k)?`<button class="btn ok" id="dPay">${ic("wallet")}Tahsilat</button>`:""}${k.tel?`<a class="btn" href="tel:${esc(telLink(k.tel))}">${ic("phone")}Ara</a><button class="btn wa" id="dMsg">${ic("wa")}Mesaj</button>`:""}</div>
  ${ps.length?`<div class="sec"><div class="sechd"><h2>Ödemeler · son ${last.length} ay</h2></div><div class="grid12">${grid}</div><p class="hint">Bir aya dokunarak o ayın ödemesini gir. Yeşil ödendi, turuncu kısmi, kırmızı gecikmiş.</p></div>`:""}
  <div class="sec"><div class="sechd"><h2>Bilgiler</h2></div><dl class="kv card pad">
    <dt>Telefon</dt><dd>${esc(k.tel||"—")}</dd>
    ${k.tc?`<dt>TC no</dt><dd>${esc(k.tc)}</dd>`:""}
    <dt>Giriş</dt><dd>${esc(fmtDate(k.giris))}</dd>
    ${c?`<dt>Sözleşme</dt><dd>${esc(fmtDate(toISO(c.bitis)))} ${c.uzama?"(uzadı)":""}</dd><dt>Süre</dt><dd>${PCT.format(Math.floor(c.yil*10)/10)} yıl${c.on?" · 10 yıl doldu":c.bes?" · 5 yıl doldu":""}</dd>`:""}
    ${k.cikis?`<dt>Çıkış</dt><dd>${esc(fmtDate(k.cikis))}</dd>`:""}
    <dt>Depozito</dt><dd>${k.depozito?TL.format(k.depozito):"—"}</dd>
    <dt>Toplam tahsilat</dt><dd>${TL.format(allPays.reduce((s,o)=>s+(+o.tutar||0),0))}</dd>
    ${k.not?`<dt>Not</dt><dd style="text-align:left;grid-column:1/-1;white-space:pre-wrap">${esc(k.not)}</dd>`:""}
  </dl></div>
  ${c&&(c.bes||c.on)?`<div class="banner warn">${ic("doc")}<span>${c.on?"Kiracı 10 yılı doldurdu. Yeni kira yılının bitiminden en az 3 ay önce bildirimde bulunarak sözleşmeyi sona erdirme hakkın doğar.":"Kiracı 5 yılı doldurdu. Anlaşamazsanız kira tespit davası açılabilir."} Hukuki adımdan önce bir avukata danışmanı öneririm.</span></div>`:""}
  ${hist.length?`<div class="sec"><div class="sechd"><h2>Zam geçmişi</h2></div><div class="card list">${hist.map(h=>`<div class="item"><span class="av">${ic("up")}</span><span class="main"><b>${TL.format(h.eski)} → ${TL.format(h.yeni)}</b><small>${esc(fmtDate(h.tarih))}</small></span><span class="side"><b>%${PCT.format(h.oran)}</b></span></div>`).join("")}</div></div>`:""}

  <button class="btn danger" id="dDel">Kiracıyı sil</button>`,(q,close,ov)=>{
    const sh=ov.querySelector(".sheet");
    q("#dPay")&&(q("#dPay").onclick=()=>openPay(k.id));
    q("#dMsg")&&(q("#dMsg").onclick=()=>openMessage(k.id));
    q("[data-r]")&&(q("[data-r]").onclick=()=>openRaise(k.id));
    q("#dRaise")&&(q("#dRaise").onclick=()=>openRaise(k.id));
    q("#dEdit").onclick=()=>openKiraci(k.id);
    sh.querySelectorAll(".grid12 button").forEach(b=>b.onclick=()=>openPay(k.id,b.dataset.ym));
    sh.querySelectorAll("[data-rcpt]").forEach(b=>b.onclick=()=>openReceipt(b.dataset.rcpt));
    q("#dOut")&&(q("#dOut").onclick=()=>{
      sheet(`<h3>Çıkış kaydı</h3><p class="sub">${esc(k.ad)}</p><div class="fld"><label for="oT">Çıkış tarihi</label><input id="oT" type="date" value="${todayISO()}"></div><p class="hint">Kiracı "Çıkanlar" listesine taşınır, geçmiş kayıtları kalır.${k.depozito?` Depozito: ${TL.format(k.depozito)}.`:""}</p><div class="btns grow"><button class="btn" data-close>Vazgeç</button><button class="btn pri" id="oOk">Kaydet</button></div>`,(q2,c2)=>{q2("#oOk").onclick=()=>{k.cikis=q2("#oT").value||todayISO();save();c2();close();render();toast("Çıkış kaydedildi")}})
    });
    q("#dBack")&&(q("#dBack").onclick=()=>{k.cikis="";save();close();render();openDetail(k.id)});
    q("#dDel").onclick=async()=>{
      if(!await confirmSheet("Kiracı silinsin mi?",`${k.ad} ve tüm ödeme kayıtları kalıcı olarak silinir. Taşındıysa "Çıkış" kullanman daha iyi olur.`,"Sil",true))return;
      S.kiracilar=S.kiracilar.filter(x=>x.id!==k.id);S.odemeler=S.odemeler.filter(o=>o.kiraciId!==k.id);save();close();render();toast("Silindi");
    };
  });
}

/* ---------- tahsilat ---------- */
function openPay(kid,ym){
  const act=S.kiracilar.filter(isActive).sort((a,b)=>a.ad.localeCompare(b.ad,"tr"));
  if(!act.length&&!kid){toast("Önce bir kiracı ekle");return}
  const firstOpen=k=>{const p=periods(k);return p.find(x=>{const s=periodState(k,x).st;return s!=="paid"})||curYM()};
  let k=kid?kById(kid):act[0];
  sheet(`<h3>Tahsilat</h3>
  <div class="fld"><label for="pK">Kiracı</label><select id="pK">${opt(S.kiracilar.filter(x=>isActive(x)||x.id===kid).sort((a,b)=>a.ad.localeCompare(b.ad,"tr")).map(x=>[x.id,x.ad]),k.id)}</select></div>
  <div class="g2"><div class="fld"><label for="pD">Hangi ayın kirası</label><input id="pD" type="month"></div>
  <div class="fld"><label for="pT">Tutar (₺)</label><input id="pT" inputmode="decimal"></div></div>
  <p class="hint" id="pInfo"></p>
  <label class="banner info" id="pAllW" style="cursor:pointer" hidden><input type="checkbox" id="pAll" style="width:20px;height:20px;accent-color:var(--brand)"><span id="pAllT"></span></label>
  <div class="g2"><div class="fld"><label for="pTar">Ödeme tarihi</label><input id="pTar" type="date" value="${todayISO()}"></div>
  <div class="fld"><label for="pY">Yöntem</label><select id="pY">${opt(YONTEM,"Havale / EFT")}</select></div></div>
  <div class="fld"><label for="pN">Not</label><input id="pN" placeholder="İsteğe bağlı"></div>
  <p class="err" id="pErr"></p>
  <div class="btns grow"><button class="btn" data-close>Vazgeç</button><button class="btn ok" id="pSave">Kaydet</button></div>`,(q,close)=>{
    let fill=(setYm)=>{
      k=kById(q("#pK").value);
      if(setYm)q("#pD").value=setYm;
      const d=q("#pD").value||curYM(),s=periodState(k,d);
      const rest=Math.max(0,s.due-s.paid);
      q("#pT").value=fmtInput(rest||s.due);
      q("#pInfo").textContent=`${ymLabel(d)} kirası ${TL.format(s.due)}${s.paid?`, şimdiye kadar ${TL.format(s.paid)} ödendi`:""}. Toplam gecikmiş borç: ${TL.format(balance(k))}.`;
    };
    const openMonths=k=>periods(k).filter(x=>{const t=periodState(k,x).st;return t==="late"||t==="partlate"||(x===curYM()&&t!=="paid")});
    const allInfo=()=>{const om=openMonths(k);q("#pAllW").hidden=om.length<2;q("#pAll").checked=false;q("#pAllT").textContent=`Açık ${om.length} ayın hepsini tek seferde kapat (${om.map(ymShort).join(", ")}) · ${TL.format(om.reduce((t,x)=>{const z=periodState(k,x);return t+z.due-z.paid},0))}`;};
    const _fill=fill;fill=(v)=>{_fill(v);allInfo()};
    q("#pAll").onchange=()=>{const on=q("#pAll").checked;q("#pD").disabled=on;q("#pT").disabled=on};
    fill(ym||firstOpen(k));
    q("#pK").onchange=()=>fill(firstOpen(kById(q("#pK").value)));
    q("#pD").onchange=()=>fill();
    q("#pSave").onclick=()=>{
      if(q("#pAll").checked){
        const tar=q("#pTar").value||todayISO();let n=nextReceiptNo(),c=0,sum=0;
        for(const x of openMonths(k)){const z=periodState(k,x),r=z.due-z.paid;if(r<=0)continue;S.odemeler.push({id:uid(),kiraciId:k.id,donem:x,tutar:r,tarih:tar,yontem:q("#pY").value,not:q("#pN").value.trim(),ts:Date.now(),no:n++});c++;sum+=r}
        save();close();render();refreshDetail(k.id);toast(`${c} ay kapatıldı · ${TL.format(sum)}`);return;
      }
      const t=parseMoney(q("#pT").value),d=q("#pD").value,tar=q("#pTar").value;
      if(!(t>0)){q("#pErr").textContent="Tutarı yaz.";return}
      if(!d||!tar){q("#pErr").textContent="Ay ve tarih gerekli.";return}
      const o={id:uid(),kiraciId:k.id,donem:d,tutar:t,tarih:tar,yontem:q("#pY").value,not:q("#pN").value.trim(),ts:Date.now(),no:nextReceiptNo()};
      S.odemeler.push(o);save();close();render();refreshDetail(k.id);
      toast("Tahsilat kaydedildi");
      openReceipt(o.id);
    };
  });
}
function openBulk(ym){
  const rows=S.kiracilar.filter(k=>periods(k).includes(ym)&&periodState(k,ym).st!=="paid").sort((a,b)=>a.ad.localeCompare(b.ad,"tr"));
  sheet(`<h3>Toplu tahsilat</h3><p class="sub">${esc(ymLabel(ym))} kirası · ödeyenleri işaretle</p>
  <div class="card list" id="bl">${rows.map(k=>{const x=periodState(k,ym),r=x.due-x.paid;return`<label class="item" style="cursor:pointer"><input type="checkbox" data-k="${k.id}" data-t="${r}" checked style="width:22px;height:22px;accent-color:var(--ok);flex-shrink:0"><span class="main"><b>${esc(k.ad)}</b><small>${x.paid?`${TL.format(x.paid)} ödenmiş · kalan `:""}${TL.format(r)}${x.st==="late"||x.st==="partlate"?" · gecikti":""}</small></span><span class="side"><b>${TL.format(r)}</b></span></label>`}).join("")}</div>
  <div class="btns"><button class="btn sm" id="bAll">Hepsini seç</button><button class="btn sm" id="bNone">Hiçbirini seçme</button></div>
  <div class="g2"><div class="fld"><label for="bTar">Ödeme tarihi</label><input id="bTar" type="date" value="${todayISO()}"></div><div class="fld"><label for="bY">Yöntem</label><select id="bY">${opt(YONTEM,"Havale / EFT")}</select></div></div>
  <div class="calc"><span id="bN"></span><b id="bT"></b></div>
  <div class="btns grow"><button class="btn" data-close>Vazgeç</button><button class="btn ok" id="bSave">Kaydet</button></div>`,(q,close,ov)=>{
    const boxes=[...ov.querySelectorAll("#bl input")];
    const upd=()=>{const on=boxes.filter(b=>b.checked);q("#bN").textContent=`${on.length} kiracı`;q("#bT").textContent=TL.format(on.reduce((t,b)=>t+ +b.dataset.t,0));q("#bSave").disabled=!on.length};
    boxes.forEach(b=>b.onchange=upd);upd();
    q("#bAll").onclick=()=>{boxes.forEach(b=>b.checked=true);upd()};
    q("#bNone").onclick=()=>{boxes.forEach(b=>b.checked=false);upd()};
    q("#bSave").onclick=()=>{
      const tar=q("#bTar").value||todayISO(),y=q("#bY").value;let n=nextReceiptNo(),c=0;
      boxes.filter(b=>b.checked).forEach(b=>{S.odemeler.push({id:uid(),kiraciId:b.dataset.k,donem:ym,tutar:+b.dataset.t,tarih:tar,yontem:y,not:"Toplu tahsilat",ts:Date.now(),no:n++});c++});
      save();close();render();toast(`${c} tahsilat kaydedildi`);
    };
  });
}
function nextReceiptNo(){return S.odemeler.reduce((m,o)=>Math.max(m,+o.no||0),0)+1}
function receiptHTML(o){
  const k=kById(o.kiraciId)||{ad:"—"},m=mById(k.mulkId);
  return`<div class="rcpt"><div class="top"><div><b>Kira Ödeme Makbuzu</b><div class="hint">No ${String(o.no||"").padStart(4,"0")}</div></div><div class="hint" style="text-align:right">${esc(fmtDate(o.tarih))}</div></div>
  <div class="amt">${TL2.format(o.tutar)}</div>
  <dl class="kv"><dt>Ödeyen</dt><dd>${esc(k.ad)}</dd><dt>Alan</dt><dd>${esc(S.ayar.ad||"Ev sahibi")}</dd>${m?`<dt>Mülk</dt><dd>${esc(m.ad)}${m.adres?"<br><small>"+esc(m.adres)+"</small>":""}</dd>`:""}<dt>Dönem</dt><dd>${esc(ymLabel(o.donem))} kirası</dd><dt>Yöntem</dt><dd>${esc(o.yontem||"—")}</dd>${o.not?`<dt>Not</dt><dd>${esc(o.not)}</dd>`:""}</dl>
  <p class="hint">Yukarıdaki tutar ${esc(ymLabel(o.donem))} dönemi kira bedeli olarak tahsil edilmiştir.</p>
  <div class="sig"><div>Teslim eden</div><div>Teslim alan</div></div></div>`;
}
function openReceipt(oid){
  const o=S.odemeler.find(x=>x.id===oid);if(!o)return;
  const k=kById(o.kiraciId)||{};
  const msg=`Merhaba ${String(k.ad||"").split(" ")[0]}, ${ymLabel(o.donem)} kirası için ${TL2.format(o.tutar)} tutarındaki ödemeniz ${trDate(o.tarih)} tarihinde alınmıştır. Makbuz no: ${String(o.no||"").padStart(4,"0")}. Teşekkürler.${S.ayar.ad?"\n"+S.ayar.ad:""}`;
  sheet(`<h3>Makbuz</h3>${receiptHTML(o)}
  <div class="btns grow">${k.tel?`<a class="btn wa" target="_blank" rel="noopener" href="${esc(waLink(k.tel,msg))}">${ic("wa")}WhatsApp</a>`:""}<button class="btn" id="rPrint">${ic("doc")}PDF / Yazdır</button></div>
  <div class="btns grow"><button class="btn danger" id="rDel">Tahsilatı sil</button><button class="btn" data-close>Kapat</button></div>`,(q,close)=>{
    q("#rPrint").onclick=()=>{$("printArea").innerHTML=receiptHTML(o);setTimeout(()=>window.print(),50)};
    q("#rDel").onclick=async()=>{if(!await confirmSheet("Tahsilat silinsin mi?",`${TL.format(o.tutar)} · ${ymLabel(o.donem)}`,"Sil",true))return;S.odemeler=S.odemeler.filter(x=>x.id!==o.id);save();close();render();refreshDetail(o.kiraciId);toast("Silindi")};
  });
}

/* ---------- zam ---------- */
function openRaise(id){
  const k=kById(id);if(!k)return;const L=limitNow(),eski=+k.kira||0;
  const g=parseISO(k.giris);let tarih=todayISO();
  if(g){const a=new Date(NOW.getFullYear(),g.getMonth(),g.getDate());if(daysBetween(today(),a)<=45&&daysBetween(today(),a)>=-300)tarih=toISO(a)}
  sheet(`<h3>Kira artışı</h3><p class="sub">${esc(k.ad)} · şu anki kira ${TL.format(eski)}</p>
  <div class="quick"><button class="hl" data-p="${L.tufe}">%${PCT.format(L.tufe)} TÜFE</button>${[10,20,25,30].map(p=>`<button data-p="${p}">%${p}</button>`).join("")}</div>
  <div class="g2"><div class="fld"><label for="zO">Oran (%)</label><input id="zO" inputmode="decimal" value="${fmtInput(L.tufe)}"></div>
  <div class="fld"><label for="zY">Yeni kira (₺)</label><input id="zY" inputmode="decimal"></div></div>
  <div class="calc"><span>Yeni aylık kira</span><b id="zR"></b></div>
  <div class="fld"><label for="zT">Geçerlilik tarihi</label><input id="zT" type="date" value="${tarih}"></div>
  <p class="err" id="zW"></p>
  <p class="hint">Konut ve iş yeri kiralarında artış, önceki kira yılının 12 aylık TÜFE ortalamasını geçemez. Şu anki sınır ${esc(ymLabel(L.tufeAy))} için %${PCT.format(L.tufe)}. Yeni kira, bu tarihten sonraki ayların tahakkukunda kullanılır.</p>
  <div class="btns grow"><button class="btn" data-close>Vazgeç</button><button class="btn pri" id="zSave">Uygula</button></div>`,(q,close)=>{
    const m=mById(k.mulkId),konut=!m||m.tur!=="Arsa / diğer";
    const upd=(from)=>{
      let o=parseMoney(q("#zO").value),y=parseMoney(q("#zY").value);
      if(from==="o"){y=Math.floor(eski*(1+o/100));q("#zY").value=fmtInput(y)}
      else{o=eski?Math.round((y/eski-1)*10000)/100:0;q("#zO").value=fmtInput(o)}
      q("#zR").textContent=TL.format(y)+` (+${TL.format(Math.max(0,y-eski))})`;
      q("#zW").textContent=konut&&o>L.tufe+0.005?`Bu artış (%${PCT.format(o)}) yasal sınırın (%${PCT.format(L.tufe)}) üstünde. Kiracı kabul etmezse geçersiz sayılabilir.`:"";
    };
    upd("o");
    q("#zO").oninput=()=>upd("o");q("#zY").oninput=()=>upd("y");
    q(".quick").querySelectorAll("button").forEach(b=>b.onclick=()=>{q("#zO").value=fmtInput(+b.dataset.p);upd("o")});
    q("#zSave").onclick=()=>{
      const y=parseMoney(q("#zY").value),t=q("#zT").value;if(!(y>0)||!t)return;
      k.gecmis=k.gecmis||[];k.gecmis.push({tarih:t,eski,yeni:y,oran:eski?Math.round((y/eski-1)*10000)/100:0});
      k.kira=y;save();close();render();refreshDetail(k.id);toast("Yeni kira "+TL.format(y));
      openMessage(k.id,"zam");
    };
  });
}

/* ---------- mesaj ---------- */
function openMessage(id,start){
  const k=kById(id);if(!k)return;
  const first=String(k.ad).split(" ")[0],b=balance(k),late=lateMonths(k),L=limitNow();
  const h=(k.gecmis||[]).slice().sort((a,b)=>b.tarih.localeCompare(a.tarih))[0];
  const iban=S.ayar.iban?`\nIBAN: ${S.ayar.iban}${S.ayar.ad?" ("+S.ayar.ad+")":""}`:"";
  const sig=S.ayar.ad?`\n${S.ayar.ad}`:"";
  const T={
    hat:{l:"Hatırlatma",t:`Merhaba ${first}, ${AYLAR[NOW.getMonth()]} ayı kira ödemesi (${TL.format(rentAt(k,curYM()))}) için hatırlatma yapmak istedim. Ödeme günü ayın ${payDay(k)}'i.${iban}\nİyi günler.${sig}`},
    gec:{l:"Gecikme",t:`Merhaba ${first}, ${late.length?late.map(ymLabel).join(", ")+" dönemine ait ":""}toplam ${TL.format(b)} kira ödemeniz gecikmiş görünüyor. En kısa sürede ödeme yapabilir veya bilgi verebilir misiniz?${iban}\nTeşekkürler.${sig}`},
    zam:{l:"Zam bildirimi",t:h?`Merhaba ${first}, kira sözleşmemizin yeni dönemi ${fmtDate(h.tarih)} itibarıyla başlıyor. %${PCT.format(h.oran)} artışla yeni aylık kira ${TL.format(h.yeni)} olacaktır.${iban}\nİyi günler.${sig}`:`Merhaba ${first}, kira sözleşmemizin yeni dönemi yaklaşıyor. Yasal sınır olan %${PCT.format(L.tufe)} oranında artışla yeni aylık kira ${TL.format(Math.floor((k.kira||0)*(1+L.tufe/100)))} olacaktır.${iban}\nİyi günler.${sig}`},
    tes:{l:"Teşekkür",t:`Merhaba ${first}, ${AYLAR[NOW.getMonth()]} kirası ulaştı, teşekkür ederim. İyi günler.${sig}`}
  };
  let cur=start&&T[start]?start:(b>0?"gec":"hat");
  sheet(`<h3>Mesaj gönder</h3><p class="sub">${esc(k.ad)} · ${esc(k.tel||"telefon yok")}</p><div class="chips" style="margin:0">${Object.entries(T).map(([key,v])=>`<button class="chip" data-m="${key}">${v.l}</button>`).join("")}</div><div class="fld"><textarea id="mT" style="min-height:150px"></textarea></div><div class="btns grow"><button class="btn" id="mC">Kopyala</button><a class="btn wa" id="mW" target="_blank" rel="noopener">${ic("wa")}WhatsApp</a><a class="btn" id="mS">SMS</a></div>`,(q)=>{
    const set=key=>{cur=key;q("#mT").value=T[key].t;q(".chips").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.m===key));upd()};
    const upd=()=>{const v=q("#mT").value;q("#mW").href=waLink(k.tel,v);q("#mS").href=`sms:${telLink(k.tel)}${/iPhone|iPad/.test(navigator.userAgent)?"&":"?"}body=${encodeURIComponent(v)}`};
    q(".chips").querySelectorAll("button").forEach(b=>b.onclick=()=>set(b.dataset.m));
    q("#mT").oninput=upd;
    q("#mC").onclick=async()=>{try{await navigator.clipboard.writeText(q("#mT").value);toast("Kopyalandı")}catch(e){q("#mT").select();toast("Seçili metni kopyala")}};
    set(cur);
  });
}

/* ================== TAHSİLAT ================== */
function vTahsilat(){
  const ym=ui.tYM||curYM();
  const rows=S.kiracilar.filter(k=>periods(k).includes(ym)).sort((a,b)=>a.ad.localeCompare(b.ad,"tr"));
  const {exp,col}=monthTotals(ym);
  let h=`<div class="monthnav"><button class="iconbtn" id="tPrev" aria-label="Önceki ay">${ic("left")}</button><b>${esc(ymLabel(ym))}</b><button class="iconbtn" id="tNext" aria-label="Sonraki ay" ${ym>=curYM()?"disabled style='opacity:.4'":""}>${ic("right")}</button></div>`;
  h+=`<div class="kpis"><div class="card kpi ok"><b class="num">${TL.format(col)}</b><span>Tahsil edilen</span></div><div class="card kpi ${exp-col>0?"bad":""}"><b class="num">${TL.format(Math.max(0,exp-col))}</b><span>Kalan · beklenen ${TL.format(exp)}</span></div></div>`;
  const acik=rows.filter(k=>periodState(k,ym).st!=="paid");
  if(acik.length>1)h+=`<button class="btn ok" id="bulk" style="width:100%">${ic("check",2)}Toplu tahsilat · ${acik.length} kiracı · ${TL.format(acik.reduce((t,k)=>{const x=periodState(k,ym);return t+x.due-x.paid},0))}</button>`;
  if(!rows.length)h+=`<div class="card empty"><b>Bu ay için kayıt yok</b>Bu ayda takipte olan kiracı bulunmuyor.</div>`;
  else h+=`<div class="card list">${rows.map(k=>{const s=periodState(k,ym);const map={paid:["ok","Ödendi","p-ok"],part:["warn","Kısmi","p-warn"],partlate:["bad","Kısmi · gecikti","p-bad"],late:["bad","Gecikti","p-bad"],open:["","Bekleniyor","p-info"]}[s.st];
    return`<div class="item"><span class="av ${map[0]}" data-open="${k.id}" style="cursor:pointer">${s.st==="paid"?ic("check",2):esc(initials(k.ad))}</span><span class="main" data-open="${k.id}" style="cursor:pointer"><b>${esc(k.ad)}</b><small><span class="pill ${map[2]}">${map[1]}</span> ${s.paid&&s.st!=="paid"?TL.format(s.paid)+" / ":""}${TL.format(s.due)} · gün ${payDay(k)}</small></span><span class="act">${s.st==="paid"?"":`<button class="btn sm ok" data-pay="${k.id}" data-ym="${ym}">Tahsil</button>`}</span></div>`}).join("")}</div>`;
  const pays=S.odemeler.filter(o=>o.tarih.slice(0,7)===ym).sort((a,b)=>b.tarih.localeCompare(a.tarih));
  h+=`<section class="sec"><div class="sechd"><h2>${esc(AYLAR[+ym.slice(5)-1])} içinde alınan ödemeler</h2></div>${pays.length?`<div class="card list">${pays.map(payRow).join("")}</div>`:`<div class="card empty" style="padding:16px">Bu ay içinde girilmiş ödeme yok.</div>`}</section>`;
  $("view").innerHTML=h;
  $("bulk")&&($("bulk").onclick=()=>openBulk(ym));
  $("tPrev").onclick=()=>{ui.tYM=addMonths(ym,-1);render()};
  $("tNext").onclick=()=>{if(ym<curYM()){ui.tYM=addMonths(ym,1);render()}};
  bindCommon();
  setFab("Tahsilat",()=>openPay());
}

/* ================== GİDERLER ================== */
function vGiderler(){
  const yil=ui.gYil||String(NOW.getFullYear());
  let list=S.giderler.filter(g=>g.tarih.startsWith(yil));
  if(ui.gMulk)list=list.filter(g=>g.mulkId===ui.gMulk);
  const ayCnt=Array(12).fill(0);list.forEach(g=>ayCnt[+g.tarih.slice(5,7)-1]++);
  if(ui.gAy>=0)list=list.filter(g=>+g.tarih.slice(5,7)-1===ui.gAy);
  list.sort((a,b)=>b.tarih.localeCompare(a.tarih));
  const top=list.reduce((s,g)=>s+(+g.tutar||0),0);
  const byCat={};list.forEach(g=>byCat[g.tur]=(byCat[g.tur]||0)+(+g.tutar||0));
  const years=[...new Set([String(NOW.getFullYear()),...S.giderler.map(g=>g.tarih.slice(0,4))])].sort().reverse();
  let h=`<div class="chips">${years.map(y=>`<button class="chip ${y===yil?"on":""}" data-y="${y}">${y}</button>`).join("")}</div>`;

/* ================== RAPOR ================== */
function vRapor(){
  const yil=ui.rYil||String(NOW.getFullYear());
  const years=[...new Set([String(NOW.getFullYear()),...S.odemeler.map(o=>o.tarih.slice(0,4)),...S.giderler.map(g=>g.tarih.slice(0,4))])].sort().reverse();
  const inc=Array(12).fill(0),exp=Array(12).fill(0);
  S.odemeler.forEach(o=>{if(o.tarih.startsWith(yil))inc[+o.tarih.slice(5,7)-1]+=+o.tutar||0});
  S.giderler.forEach(g=>{if(g.tarih.startsWith(yil))exp[+g.tarih.slice(5,7)-1]+=+g.tutar||0});
  const ti=inc.reduce((a,b)=>a+b,0),te=exp.reduce((a,b)=>a+b,0);
  let h=`<div class="chips">${years.map(y=>`<button class="chip ${y===yil?"on":""}" data-y="${y}">${y}</button>`).join("")}</div>`;
  h+=`<div class="kpis"><div class="card kpi ok"><b class="num">${TL.format(ti)}</b><span>Tahsilat</span></div><div class="card kpi"><b class="num">${TL.format(te)}</b><span>Gider</span></div><div class="card kpi" style="grid-column:1/-1"><b class="num" style="font-size:24px">${TL.format(ti-te)}</b><span>Net gelir · ${yil}</span></div></div>`;
  /* grafik */
  const max=Math.max(1,...inc,...exp),W=340,H=170,pl=4,pb=18,bw=(W-pl*2)/12;
  const nice=v=>v>=1e6?PCT.format(Math.round(v/1e5)/10)+"M":v>=1e3?Math.round(v/1e3)+"b":String(Math.round(v));
  let bars="";
  for(let i=0;i<12;i++){
    const x=pl+i*bw,hi=(H-pb-14)*inc[i]/max,he=(H-pb-14)*exp[i]/max,w=(bw-6)/2;
    bars+=`<rect x="${x+2}" y="${H-pb-hi}" width="${w}" height="${Math.max(hi,inc[i]?2:0)}" rx="2" fill="var(--brand)"><title>${AYLAR[i]} tahsilat ${TL.format(inc[i])}</title></rect>`;
    bars+=`<rect x="${x+2+w+2}" y="${H-pb-he}" width="${w}" height="${Math.max(he,exp[i]?2:0)}" rx="2" fill="var(--warn)"><title>${AYLAR[i]} gider ${TL.format(exp[i])}</title></rect>`;
    bars+=`<text x="${x+bw/2}" y="${H-4}" text-anchor="middle">${AYK[i].slice(0,3)}</text>`;
  }
  h+=`<section class="sec"><div class="sechd"><h2>Aylık tahsilat ve gider</h2></div><div class="card pad"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${yil} aylık tahsilat ve gider grafiği"><line x1="0" x2="${W}" y1="${H-pb}" y2="${H-pb}" stroke="var(--line)"/><text x="${W-2}" y="10" text-anchor="end">en yüksek ${nice(max)}</text>${bars}</svg><div class="legend"><span><i style="background:var(--brand)"></i>Tahsilat</span><span><i style="background:var(--warn)"></i>Gider</span></div></div></section>`;
  /* mülk bazında */
  if(S.mulkler.length){
    const rows=S.mulkler.map(m=>{const ks=S.kiracilar.filter(k=>k.mulkId===m.id).map(k=>k.id);const i=S.odemeler.filter(o=>o.tarih.startsWith(yil)&&ks.includes(o.kiraciId)).reduce((s,o)=>s+(+o.tutar||0),0);const e=S.giderler.filter(g=>g.tarih.startsWith(yil)&&g.mulkId===m.id).reduce((s,g)=>s+(+g.tutar||0),0);return{m,i,e}});
    h+=`<section class="sec"><div class="sechd"><h2>Mülk bazında</h2></div><div class="card" style="overflow-x:auto"><table><thead><tr><th>Mülk</th><th class="r">Gelir</th><th class="r">Gider</th><th class="r">Net</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.m.ad)}</td><td class="r">${TL.format(r.i)}</td><td class="r">${TL.format(r.e)}</td><td class="r">${TL.format(r.i-r.e)}</td></tr>`).join("")}</tbody></table></div></section>`;
  }
  /* beyan özeti */
  const konutIds=new Set(S.kiracilar.filter(k=>{const m=mById(k.mulkId);return !m||m.tur==="Konut"}).map(k=>k.id));
  const konut=S.odemeler.filter(o=>o.tarih.startsWith(yil)&&konutIds.has(o.kiraciId)).reduce((s,o)=>s+(+o.tutar||0),0);
  const isyeri=ti-konut;
  h+=`<section class="sec"><div class="sechd"><h2>Vergi beyanı için özet</h2></div><div class="card pad"><dl class="kv"><dt>Konut kira geliri</dt><dd class="num">${TL.format(konut)}</dd><dt>İş yeri kira geliri</dt><dd class="num">${TL.format(isyeri)}</dd><dt>Belgelenen giderler</dt><dd class="num">${TL.format(te)}</dd></dl><p class="hint" style="margin-top:10px">${yil} yılı kira gelirleri ertesi yılın Mart ayında beyan edilir. Konut istisnası tutarı her yıl değiştiği ve hangi giderlerin düşülebileceği yönteme bağlı olduğu için beyan öncesi Gelir İdaresi'nin güncel rehberine veya bir mali müşavire bakmanı öneririm.</p></div></section>`;
  h+=`<section class="sec"><div class="sechd"><h2>Dışa aktar</h2></div><div class="btns grow"><button class="btn" id="xAll">${ic("doc")}Excel raporu</button><button class="btn" id="xBak">Yedek al</button></div></section>`;
  $("view").innerHTML=h;
  $("view").querySelectorAll("[data-y]").forEach(b=>b.onclick=()=>{ui.rYil=b.dataset.y;render()});
  $("xAll").onclick=()=>exportExcel(yil);
  $("xBak").onclick=backup;
  setFab(null);
}

/* ---------- yedek ---------- */
async function shareOrDownload(blob,name){
  const file=new File([blob],name,{type:blob.type});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:name});return true}catch(e){if(e&&e.name==="AbortError")return false}
  }
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);return true;
}
async function backup(){
  const data={...S,_app:"kira-defteri",_surum:VERSION,_tarih:new Date().toISOString()};
  const ok=await shareOrDownload(new Blob([JSON.stringify(data,null,1)],{type:"application/json"}),`kira-defteri-yedek-${todayISO()}.json`);
  if(ok){S.ayar.sonYedek=todayISO();save();render();toast("Yedek hazır")}
}
function restore(file,closeSettings){
  const r=new FileReader();
  r.onload=async()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d||!Array.isArray(d.kiracilar))throw 0;
      if(!await confirmSheet("Yedek yüklensin mi?",`Yedekte ${d.kiracilar.length} kiracı, ${(d.odemeler||[]).length} tahsilat var. Şu anki tüm veriler bu yedekle değiştirilecek.`,"Yükle",false))return;
      const keepPin=S.ayar.pinHash;
      S={...blank(),...d,ayar:{...blank().ayar,...(d.ayar||{})}};
      delete S._app;delete S._surum;delete S._tarih;
      if(!S.ayar.pinHash)S.ayar.pinHash=keepPin;
      save();applyTheme();closeAllSheets();render();toast("Yedek yüklendi");
    }catch(e){toast("Bu dosya geçerli bir yedek değil")}
  };
  r.readAsText(file);
}

/* ---------- Excel ---------- */
let xlsxP=null;
function loadXLSX(){
  if(window.XLSX)return Promise.resolve(window.XLSX);
  if(!xlsxP)xlsxP=new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";s.onload=()=>res(window.XLSX);s.onerror=()=>{xlsxP=null;rej(new Error("x"))};document.head.appendChild(s)});
  return xlsxP;
}
async function saveXlsx(name,sheets){
  try{
    const X=await loadXLSX();const wb=X.utils.book_new();
    for(const [n,rows] of sheets){const ws=X.utils.aoa_to_sheet(rows);ws["!cols"]=rows[0].map((_,i)=>({wch:Math.min(40,Math.max(10,...rows.map(r=>String(r[i]??"").length+2)))}));X.utils.book_append_sheet(wb,ws,n)}
    const out=X.write(wb,{bookType:"xlsx",type:"array"});
    await shareOrDownload(new Blob([out],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}),name);
  }catch(e){toast("Excel hazırlanamadı. İnternet bağlantısını kontrol et.")}
}
function exportExcel(yil){
  const mAd=id=>mById(id)?.ad||"";
  const k=[["Ad Soyad","Telefon","TC","Mülk","Giriş Tarihi","Sözleşme (yıl)","Aylık Kira","Ödeme Günü","Depozito","Durum","Çıkış","Gecikmiş Borç","Not"]];
  S.kiracilar.slice().sort((a,b)=>a.ad.localeCompare(b.ad,"tr")).forEach(x=>k.push([x.ad,x.tel||"",x.tc||"",mAd(x.mulkId),trDate(x.giris),+x.sure||1,+x.kira||0,payDay(x),+x.depozito||"",isActive(x)?"Aktif":"Çıktı",trDate(x.cikis),balance(x),x.not||""]));
  const t=[["Makbuz No","Ödeme Tarihi","Kiracı","Mülk","Dönem","Tutar","Yöntem","Not"]];
  S.odemeler.filter(o=>o.tarih.startsWith(yil)).sort((a,b)=>a.tarih.localeCompare(b.tarih)).forEach(o=>{const x=kById(o.kiraciId);t.push([o.no||"",trDate(o.tarih),x?x.ad:"",x?mAd(x.mulkId):"",ymLabel(o.donem),+o.tutar,o.yontem||"",o.not||""])});
  const g=[["Tarih","Tür","Mülk","Açıklama","Tutar"]];
  S.giderler.filter(x=>x.tarih.startsWith(yil)).sort((a,b)=>a.tarih.localeCompare(b.tarih)).forEach(x=>g.push([trDate(x.tarih),x.tur,mAd(x.mulkId),x.aciklama||"",+x.tutar]));
  const a=[["Ay","Tahsilat","Gider","Net"]];let ti=0,te=0;
  for(let i=0;i<12;i++){const ym=yil+"-"+pad(i+1);const inc=S.odemeler.filter(o=>o.tarih.startsWith(ym)).reduce((s,o)=>s+(+o.tutar||0),0);const ex=S.giderler.filter(x=>x.tarih.startsWith(ym)).reduce((s,x)=>s+(+x.tutar||0),0);ti+=inc;te+=ex;a.push([AYLAR[i],inc,ex,inc-ex])}
  a.push(["Toplam",ti,te,ti-te]);
  saveXlsx(`kira-raporu-${yil}.xlsx`,[["Aylık Özet",a],["Tahsilatlar",t],["Giderler",g],["Kiracılar",k]]);
}
function downloadTemplate(){saveXlsx("kiraci-sablonu.xlsx",[["Kiracılar",[["Ad Soyad","Mülk","Giriş Tarihi","Kira","Depozito","Ödeme Günü","Telefon","Not"],["Örnek Kişi","A Blok No 3","15.03.2023",15000,30000,5,"0555 000 00 00","Bu satırı silip kendi kiracılarını yaz"]]]])}
const norm=s=>String(s??"").toLocaleLowerCase("tr").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/ı/g,"i").replace(/[^a-z0-9]/g,"");
async function importExcel(file,closeSettings){
  let X;try{X=await loadXLSX()}catch(e){toast("Excel okuyucu yüklenemedi. İnternet gerekli.");return}
  const buf=await file.arrayBuffer();
  let rows;try{const wb=X.read(buf,{type:"array",cellDates:true});rows=X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:""})}catch(e){toast("Dosya okunamadı");return}
  let hi=rows.findIndex(r=>r.some(c=>/ad|isim|kiraci/.test(norm(c))));if(hi<0){toast("Başlık satırı bulunamadı");return}
  const hd=rows[hi].map(norm);
  const col=(...keys)=>hd.findIndex(h=>keys.some(k=>h.includes(k)));
  const c={ad:col("adsoyad","isim","kiraci","ad"),mulk:col("mulk","daire","adres"),giris:col("giris","baslangic"),kira:col("kira","tutar"),dep:col("depozito","teminat"),gun:col("odemegun","gun"),tel:col("telefon","tel","gsm"),not:col("not","aciklama"),sure:col("sozlesme","sure"),cikis:col("cikis")};
  const out=[];
  for(const r of rows.slice(hi+1)){
    const ad=String(r[c.ad]??"").trim();if(!ad||/^ornek/.test(norm(ad)))continue;
    out.push({ad,mulk:c.mulk>=0?String(r[c.mulk]||"").trim():"",giris:c.giris>=0?parseAnyDate(r[c.giris]):"",kira:c.kira>=0?parseMoney(r[c.kira]):0,dep:c.dep>=0?parseMoney(r[c.dep]):0,gun:c.gun>=0?parseInt(r[c.gun],10)||"":"",tel:c.tel>=0?String(r[c.tel]||"").trim():"",not:c.not>=0?String(r[c.not]||"").trim():"",sure:c.sure>=0?parseInt(r[c.sure],10)||1:1,cikis:c.cikis>=0?parseAnyDate(r[c.cikis]):""});
  }
  if(!out.length){toast("Aktarılacak satır bulunamadı");return}
  const bad=out.filter(o=>!o.giris||!(o.kira>0)).length;
  if(!await confirmSheet(`${out.length} kiracı aktarılsın mı?`,`${bad?bad+" satırda giriş tarihi veya kira eksik; onları sonra düzenleyebilirsin. ":""}Aynı isimde kayıt varsa atlanır. Ödeme takibi bu aydan başlar.`,"Aktar",false))return;
  let n=0;
  for(const o of out){
    if(S.kiracilar.some(k=>norm(k.ad)===norm(o.ad)))continue;
    let mid="";if(o.mulk){let m=S.mulkler.find(x=>norm(x.ad)===norm(o.mulk));if(!m){m={id:uid(),ad:o.mulk,tur:"Konut"};S.mulkler.push(m)}mid=m.id}
    S.kiracilar.push({id:uid(),ad:o.ad,tel:o.tel,mulkId:mid,giris:o.giris||todayISO(),sure:o.sure,kira:o.kira,odemeGunu:o.gun,depozito:o.dep||"",takipBas:curYM(),not:o.not,cikis:o.cikis,gecmis:[]});n++;
  }
  save();closeAllSheets();render();toast(n+" kiracı aktarıldı");
}

/* ================== PIN ================== */
async function hashPin(p){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("kd:"+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function pinPad(title,onDone,cancelable){
  const el=document.createElement("div");el.className="lock";
  let v="";
  el.innerHTML=`<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="var(--brand)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><h2 id="lt">${esc(title)}</h2><div class="dots" id="ld">${"<i></i>".repeat(4)}</div><div class="pad3">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-n="${n}">${n}</button>`).join("")}<button class="t" data-x="c">${cancelable?"Vazgeç":""}</button><button data-n="0">0</button><button class="t" data-x="b">Sil</button></div>`;
  document.body.appendChild(el);
  const dots=()=>el.querySelectorAll("#ld i").forEach((d,i)=>d.classList.toggle("f",i<v.length));
  const api={el,reset(msg,ok){if(!ok){v="";dots()}if(msg)el.querySelector("#lt").textContent=msg;el.querySelector("#lt").style.color=ok?"":"var(--bad)";if(ok)return;const d=el.querySelector("#ld");d.classList.remove("shake");void d.offsetWidth;d.classList.add("shake");if(navigator.vibrate)navigator.vibrate(120)},close(){el.remove();document.removeEventListener("keydown",kd)}};
  const press=n=>{if(v.length>=4)return;v+=n;dots();if(v.length===4){const p=v;v="";setTimeout(dots,150);onDone(p,api)}};
  el.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>press(b.dataset.n));
  el.querySelector('[data-x="b"]').onclick=()=>{v=v.slice(0,-1);dots()};
  el.querySelector('[data-x="c"]').onclick=()=>{if(cancelable)api.close()};
  const kd=e=>{if(/^\d$/.test(e.key))press(e.key);else if(e.key==="Backspace"){v=v.slice(0,-1);dots()}};
  document.addEventListener("keydown",kd);
  return api;
}
let locked=false;
function lockIfNeeded(){
  if(!S.ayar.pinHash||locked)return;
  locked=true;
  pinPad("PIN gir",async(p,api)=>{if(await hashPin(p)===S.ayar.pinHash){api.close();locked=false}else api.reset("Yanlış PIN, tekrar dene")},false);
}
function openPinSetup(){
  const setNew=()=>{let first="";pinPad("Yeni PIN belirle (4 hane)",async(p,api)=>{
    if(!first){first=p;api.reset("Aynı PIN'i tekrar gir",true);return}
    if(p!==first){first="";api.reset("Eşleşmedi, baştan gir");return}
    S.ayar.pinHash=await hashPin(p);save();api.close();toast("PIN kilidi açıldı");
  },true)};
  if(!S.ayar.pinHash){confirmSheet("PIN kilidi açılsın mı?","Açarsan uygulama her açılışta 4 haneli bir şifre sorar. Şifreyi unutursan sadece yedekten geri dönebilirsin. İstemiyorsan Vazgeç'e bas.","PIN belirle",false).then(ok=>{if(ok)setNew()});return}
  sheet(`<h3>PIN kilidi</h3><p class="hint">PIN'i unutursan uygulamaya giremezsin; o durumda tarayıcı verisini silip yedekten yüklemen gerekir.</p><div class="btns grow"><button class="btn" id="pc">PIN'i değiştir</button><button class="btn danger" id="po">Kilidi kapat</button></div>`,(q,close)=>{
    q("#pc").onclick=()=>{close();pinPad("Mevcut PIN",async(p,api)=>{if(await hashPin(p)!==S.ayar.pinHash){api.reset("Yanlış PIN");return}api.close();setNew()},true)};
    q("#po").onclick=()=>{close();pinPad("Mevcut PIN",async(p,api)=>{if(await hashPin(p)!==S.ayar.pinHash){api.reset("Yanlış PIN");return}S.ayar.pinHash="";save();api.close();toast("PIN kilidi kapatıldı")},true)};
  });
}
let hiddenAt=0;
document.addEventListener("visibilitychange",()=>{
  if(document.hidden)hiddenAt=Date.now();
  else{if(S.ayar.pinHash&&Date.now()-hiddenAt>3*60*1000)lockIfNeeded();if(Date.now()-hiddenAt>60*60*1000)fetchTufe();render()}
});

load();applyTheme();
try{const t=sessionStorage.getItem("tab");if(t&&TABS.some(x=>x[0]===t))tab=t}catch(e){}
$("btnSettings").onclick=openSettings;
render();
lockIfNeeded();
fetchTufe();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if("serviceWorker" in navigator&&location.protocol!=="file:")navigator.serviceWorker.register("sw.js").catch(()=>{});
window.addEventListener("storage",e=>{if(e.key===KEY){load();render()}});
</script>
